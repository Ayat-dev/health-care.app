# ============================================================
#  Profil DEV — base H2 en mémoire, données de test seedées
#  (DataInitializer s'active sur tout profil SAUF prod)
# ============================================================

spring.datasource.url=jdbc:h2:mem:clinicdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 : pratique en dev, JAMAIS en prod
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Secret de DEV uniquement — surchargé par ${JWT_SECRET} en prod
app.jwt.secret=clinicapp-dev-secret-key-not-for-production-min32chars!!

# Clé de chiffrement PHI au repos (P2.5) — DEV uniquement, surchargée par
# ${APP_ENCRYPTION_KEY} en prod. Dérivée en AES-256 par SHA-256.
app.encryption.key=clinicapp-dev-encryption-key-not-for-production!!
