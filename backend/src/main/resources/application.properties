# ============================================================
#  Configuration COMMUNE à tous les profils
#  Les réglages spécifiques à un environnement (datasource,
#  secrets, console H2) sont dans application-{dev,prod}.properties
# ============================================================

# Profil actif par défaut = dev. Surcharge en prod via la variable
# d'environnement SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

server.port=8080

# Flyway gère le schéma ; Hibernate ne fait que valider
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# OSIV désactivé (cf. CLAUDE.md : les read-paths fetch leurs assocs)
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Stockage des fichiers (photos patients, images radio)
app.storage.upload-dir=${APP_STORAGE_UPLOAD_DIR:uploads}

# ── Licence + mode d'essai (Phase 3 desktop) ─────────────────────────────────
# Enforcement OPT-IN : false par défaut (dev/test/prod-web ne sont jamais bloqués et
# n'écrivent aucun marqueur d'essai) ; activé à true dans le profil desktop.
app.license.enforce=${LICENSE_ENFORCE:false}
app.license.trial-days=${LICENSE_TRIAL_DAYS:30}
# Clé publique Ed25519 de l'éditeur (X.509/SPKI base64) — vérifie les clés de licence
# HORS-LIGNE. La clé privée correspondante reste chez l'éditeur (jamais distribuée).
app.license.public-key=${LICENSE_PUBLIC_KEY:MCowBQYDK2VwAyEA5QYSj/T0LDRhcJ22reIg933WvqF3MGr8Dg9rYR47ObQ=}

# Chiffrement des fichiers au repos (D3b) — AES-GCM appliqué au contenu uploadé.
# Clé dédiée (par défaut = la clé maître app.encryption.key) → tourner la clé des
# fichiers ne touche pas les colonnes PHI chiffrées (D3a). Pour une rotation, fournir
# l'ancienne clé via previous-key puis appeler POST /api/admin/maintenance/rotate-file-encryption,
# enfin retirer previous-key.
app.storage.encryption.key=${APP_STORAGE_ENCRYPTION_KEY:${app.encryption.key}}
app.storage.encryption.previous-key=${APP_STORAGE_ENCRYPTION_PREVIOUS_KEY:}

# Upload : 5 Mo max
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT (P4.4) — access token COURT (15 min) + refresh token LONG (7 jours).
# L'access token reste stateless (révocable via la version de token, cf. JwtFilter) ;
# le refresh token est stocké côté serveur (rotatif + révocable).
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
# D1a — front web : le refresh token peut être posé en cookie HttpOnly/SameSite plutôt
# qu'en JSON (jamais exposé au JS). Secure=true par défaut (prod HTTPS) ; surchargé à
# false en dev/test (HTTP) sinon le navigateur n'émet jamais le cookie.
app.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:true}
# D1b — rétention (jours) des refresh tokens expirés/révoqués avant purge par le job
# planifié. On garde un jeton révoqué cette durée pour la détection de réutilisation/vol.
app.jwt.refresh-cleanup-retention-days=${JWT_REFRESH_CLEANUP_RETENTION_DAYS:7}

# D1d — rate-limit par IP sur le login (Bucket4j). Complète le lockout par compte (P1.3)
# contre le brute-force/DoS distribué (réparti sur plusieurs comptes). Plus permissif que
# le lockout compte car une clinique derrière un NAT partage une IP publique.
app.security.login-rate-limit.max-attempts=${LOGIN_RATE_LIMIT_MAX:20}
app.security.login-rate-limit.window-minutes=${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}

# i18n (P3.2) — bundles messages{,_en,_ar}.properties en UTF-8
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Télémédecine (P3.7) — base de l'URL des salles visio. Jitsi Meet public par
# défaut (sans compte, sans IA) ; pointer vers une instance auto-hébergée en prod.
app.telemedicine.base-url=${TELEMEDICINE_BASE_URL:https://meet.jit.si/}

# Monitoring (P4.3) — Spring Actuator + Prometheus/Grafana, UptimeRobot.
# Endpoints exposés sur HTTP. health + info sont publics (sondes UptimeRobot /
# load-balancer) ; prometheus + metrics sont protégés par HTTP Basic (cf.
# SecurityConfig, chaîne /actuator/**). Les détails de santé (BDD, disque…) ne
# sont révélés qu'à un appelant authentifié → la sonde anonyme ne voit que UP/DOWN.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=clinicapp
management.info.env.enabled=true
# D2b — build-info (version/heure) + git (branche/commit) dans /actuator/info.
# Les beans BuildProperties/GitProperties proviennent des fichiers générés au build
# (spring-boot:build-info + git-commit-id, cf. pom). Mode git « full » = id complet + heure.
management.info.build.enabled=true
management.info.git.enabled=true
management.info.git.mode=full
info.app.name=ClinicApp
info.app.description=Système de gestion de clinique
info.app.version=@project.version@

# Identifiant du compte de scraping monitoring (HTTP Basic sur /actuator/prometheus).
# Le mot de passe n'a PAS de défaut en prod (fail-fast, cf. application-prod) ; dev/test
# fournissent une valeur fixe. Compte dédié, indépendant des utilisateurs métier.
app.monitoring.username=${MONITORING_USERNAME:monitor}

# Scribe IA ambiant (P4.1) — structuration texte→note via un modèle Claude.
# DÉSACTIVÉ par défaut : nécessite une clé API Anthropic ET l'acceptation d'envoyer
# le transcript de consultation au cloud Anthropic (PHI → BAA/Zero-Data-Retention
# en prod). Activer avec SCRIBE_ENABLED=true + ANTHROPIC_API_KEY.
app.scribe.enabled=${SCRIBE_ENABLED:false}
app.scribe.model=${SCRIBE_MODEL:claude-opus-4-8}
app.scribe.api-key=${ANTHROPIC_API_KEY:}
