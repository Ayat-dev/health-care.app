<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#0f172a"/>
    <title>Hors ligne — ClinicApp</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: 'Inter', system-ui, sans-serif;
            color: #0f172a;
        }
        .offline-card {
            max-width: 420px;
            padding: 40px 32px;
            margin: 24px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,.08);
            text-align: center;
        }
        .offline-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            border-radius: 16px;
            font-size: 32px;
            color: #3b82f6;
        }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #64748b; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
        button {
            padding: 11px 24px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">⚕</div>
        <h1>Connexion indisponible</h1>
        <p>
            Vous êtes hors ligne ou le serveur de la clinique est injoignable.
            Vos données ne sont pas perdues : reconnectez-vous au réseau puis réessayez.
        </p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </div>
</body>
</html>
