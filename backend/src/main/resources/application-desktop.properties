# ============================================================
#  Profil DESKTOP — installation tout-en-un sur un poste de clinique
#  (Phase 1). PostgreSQL EMBARQUÉ : le DataSource est fourni par
#  DesktopDatabaseConfig (bean), pas par spring.datasource.*.
#  Les secrets (JWT, chiffrement PHI, webhook, monitoring) et le
#  dossier uploads sont générés/injectés par
#  DesktopSecretsEnvironmentPostProcessor → aucun .env requis.
#  L'installation nominale passe par l'assistant web /setup.
# ============================================================

# Comme en prod : Flyway migre, Hibernate valide (hérité de application.properties).
spring.jpa.show-sql=false

# Console H2 sans objet (base = PostgreSQL embarqué).
spring.h2.console.enabled=false

# Accès local en HTTP (localhost) : les cookies « Secure » ne seraient jamais émis.
app.jwt.refresh-cookie-secure=false
server.servlet.session.cookie.secure=false

# ── Réglages du mode desktop (surchargeables) ────────────────────────────────
# Port du cluster PostgreSQL embarqué (évite le 5432 d'un éventuel PG déjà installé).
app.desktop.db-port=15432
# Sauvegardes locales automatiques (dump SQL) : nuit + démarrage, rétention en jours.
app.desktop.backup.cron=0 0 2 * * *
app.desktop.backup.retention-days=14
app.desktop.backup.timeout-seconds=120
