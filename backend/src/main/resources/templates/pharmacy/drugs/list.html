<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{pharmacy.drugs.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${success}" class="alert alert-info" th:text="${success}">OK</div>
<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel">
    <div class="panel-header">
        <span th:text="#{pharmacy.drugs.heading}">Catalogue des médicaments</span>
        <th:block sec:authorize="hasRole('PHARMACIEN')">
            <a th:href="@{/pharmacy/drugs/new}" class="btn btn-primary btn-sm" th:text="#{pharmacy.drugs.new}">+ Nouveau médicament</a>
        </th:block>
    </div>

    <form method="get" th:action="@{/pharmacy/drugs}" class="search-bar">
        <input type="text" name="q" th:value="${q}" class="form-control"
               th:placeholder="#{pharmacy.drugs.search_placeholder}" th:aria-label="#{pharmacy.drugs.search_placeholder}" placeholder="Nom, DCI ou code…" style="max-width:280px;"/>
        <select name="category" class="form-control" style="max-width:220px;" th:aria-label="#{pharmacy.drugs.col_category}">
            <option value="" th:text="#{pharmacy.drugs.all_categories}">— Toutes catégories —</option>
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"
                    th:selected="${category == c}">Catégorie</option>
        </select>
        <button type="submit" class="btn btn-primary btn-sm" th:text="#{common.filter}">Filtrer</button>
    </form>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{pharmacy.drugs.col_code}">Code</th>
                <th scope="col" th:text="#{pharmacy.drugs.col_name}">Nom commercial</th>
                <th scope="col" th:text="#{pharmacy.drugs.col_generic}">DCI</th>
                <th scope="col" th:text="#{pharmacy.drugs.col_form}">Forme</th>
                <th scope="col" th:text="#{pharmacy.drugs.col_dosage}">Dosage</th>
                <th scope="col" th:text="#{pharmacy.drugs.col_category}">Catégorie</th>
                <th scope="col" th:text="#{pharmacy.drugs.col_prescription}">Ordonnance</th>
                <th scope="col" th:text="#{common.status}">Statut</th>
                <th scope="col" th:text="#{common.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${drugs.isEmpty()}">
                <td colspan="9" class="empty-state" th:text="#{pharmacy.drugs.empty}">Aucun médicament.</td>
            </tr>
            <tr th:each="d : ${drugs}">
                <td th:text="${d.code ?: '—'}">COD</td>
                <td><strong th:text="${d.name}">Nom</strong></td>
                <td th:text="${d.genericName ?: '—'}">DCI</td>
                <td th:text="${d.form ?: '—'}">Forme</td>
                <td th:text="${d.dosageStrength ?: '—'}">500mg</td>
                <td th:text="${d.category ?: '—'}">Cat</td>
                <td>
                    <span th:if="${d.requiresPrescription}" class="badge badge-yellow" th:text="#{pharmacy.drugs.rx_required}">Sur ordonnance</span>
                    <span th:unless="${d.requiresPrescription}" class="badge badge-green" th:text="#{pharmacy.drugs.otc}">Vente libre</span>
                </td>
                <td>
                    <span th:if="${d.active}" class="badge badge-green" th:text="#{pharmacy.drugs.active}">Actif</span>
                    <span th:unless="${d.active}" class="badge badge-red" th:text="#{pharmacy.drugs.inactive}">Désactivé</span>
                </td>
                <td style="white-space:nowrap;">
                    <th:block sec:authorize="hasRole('PHARMACIEN')">
                        <a th:href="@{/pharmacy/stock/receive(drugId=${d.id})}" class="btn btn-ghost btn-sm" th:text="#{pharmacy.action.receive}">Réceptionner</a>
                        <a th:href="@{/pharmacy/drugs/{id}/edit(id=${d.id})}" class="btn btn-ghost btn-sm" th:text="#{common.edit}">Modifier</a>
                        <form th:action="@{/pharmacy/drugs/{id}/toggle(id=${d.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-ghost btn-sm"
                                    th:text="${d.active} ? #{pharmacy.drugs.deactivate} : #{pharmacy.drugs.activate}">Basculer</button>
                        </form>
                    </th:block>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
