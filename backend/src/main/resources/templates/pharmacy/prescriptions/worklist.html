<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{pharmacy.worklist.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${success}" class="alert alert-success" th:text="${success}">OK</div>
<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel" data-worklist-topic="/topic/worklist/pharmacy">
    <div class="panel-header">
        <span th:text="#{pharmacy.worklist.heading}">Ordonnances à dispenser — les plus anciennes d'abord</span>
        <div style="display:flex; gap:.5rem;">
            <a th:href="@{/pharmacy/dispensations}" class="btn btn-ghost btn-sm" th:text="#{pharmacy.dispensations.history}">Historique des dispensations</a>
            <a th:href="@{/pharmacy/dispensations/new}" class="btn btn-primary btn-sm" th:text="#{pharmacy.worklist.free_dispensation}">+ Dispensation libre</a>
        </div>
    </div>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th th:text="#{common.date}">Date</th>
                <th th:text="#{pharmacy.col.number}">N°</th>
                <th th:text="#{pharmacy.col.patient}">Patient</th>
                <th th:text="#{pharmacy.col.doctor}">Médecin</th>
                <th style="text-align:center;" th:text="#{pharmacy.worklist.col_lines}">Lignes</th>
                <th th:text="#{common.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${prescriptions.isEmpty()}">
                <td colspan="6" class="empty-state" th:text="#{pharmacy.worklist.empty}">Aucune ordonnance en attente de dispensation. 🎉</td>
            </tr>
            <tr th:each="p : ${prescriptions}">
                <td th:text="${#temporals.format(p.issueDate,'dd/MM/yyyy')}">01/01/2026</td>
                <td><strong th:text="${p.prescriptionNumber}">ORD-…</strong></td>
                <td>
                    <span th:text="${p.patientName}">Patient</span>
                    <span class="badge badge-blue" th:text="${p.patientRecordNumber}">PAT-…</span>
                </td>
                <td th:text="${p.doctorName ?: '—'}">Médecin</td>
                <td style="text-align:center;" th:text="${p.items.size()}">0</td>
                <td style="white-space:nowrap;">
                    <a th:href="@{/pharmacy/dispensations/new(prescriptionId=${p.id})}"
                       class="btn btn-primary btn-sm" th:text="#{pharmacy.action.dispense}">Dispenser</a>
                    <a th:href="@{/prescriptions/{id}/print(id=${p.id})}"
                       class="btn btn-ghost btn-sm" target="_blank" th:text="#{common.view}">Voir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
