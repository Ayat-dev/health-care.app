<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{pharmacy.stock.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${success}" class="alert alert-info" th:text="${success}">OK</div>
<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel">
    <div class="panel-header">
        <span th:text="#{pharmacy.stock.heading}">État du stock</span>
        <th:block sec:authorize="hasRole('PHARMACIEN')">
            <a th:href="@{/pharmacy/stock/receive}" class="btn btn-primary btn-sm" th:text="#{pharmacy.stock.receive}">+ Réceptionner un lot</a>
        </th:block>
    </div>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{pharmacy.col.drug}">Médicament</th>
                <th scope="col" th:text="#{pharmacy.stock.col_batch}">Lot</th>
                <th scope="col" th:text="#{pharmacy.stock.col_expiry}">Péremption</th>
                <th scope="col" style="text-align:right;" th:text="#{pharmacy.col.quantity}">Quantité</th>
                <th scope="col" style="text-align:right;" th:text="#{pharmacy.stock.col_threshold}">Seuil</th>
                <th scope="col" style="text-align:right;" th:text="#{pharmacy.stock.col_price}">Prix vente</th>
                <th scope="col" th:text="#{pharmacy.stock.col_supplier}">Fournisseur</th>
                <th scope="col" th:text="#{pharmacy.stock.col_alerts}">Alertes</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${stock.isEmpty()}">
                <td colspan="8" class="empty-state" th:text="#{pharmacy.stock.empty}">Aucun lot en stock. Réceptionnez une commande pour commencer.</td>
            </tr>
            <tr th:each="s : ${stock}">
                <td>
                    <strong th:text="${s.drugName}">Médicament</strong>
                    <span th:if="${s.drugDosage}" class="text-muted" th:text="' · ' + ${s.drugDosage}"></span>
                </td>
                <td th:text="${s.batchNumber ?: '—'}">LOT</td>
                <td th:text="${s.expiryDate != null ? #temporals.format(s.expiryDate,'dd/MM/yyyy') : '—'}">01/01/2027</td>
                <td style="text-align:right;"><strong th:text="${s.quantity}">0</strong>
                    <span th:if="${s.drugUnit}" class="text-muted" th:text="' ' + ${s.drugUnit}"></span>
                </td>
                <td style="text-align:right;" th:text="${s.quantityAlert}">10</td>
                <td style="text-align:right;"
                    th:text="${s.sellingPrice != null ? #numbers.formatDecimal(s.sellingPrice,0,'WHITESPACE',0,'POINT') + ' F' : '—'}">0 F</td>
                <td th:text="${s.supplier ?: '—'}">Fournisseur</td>
                <td style="white-space:nowrap;">
                    <span th:if="${s.expired}" class="badge badge-red" th:text="#{pharmacy.stock.expired}">Périmé</span>
                    <span th:if="${s.expiringSoon}" class="badge badge-yellow" th:text="#{pharmacy.stock.expiring_soon}">Périme bientôt</span>
                    <span th:if="${s.low and !s.expired}" class="badge badge-red" th:text="#{pharmacy.stock.low}">Stock faible</span>
                    <span th:if="${!s.low and !s.expired and !s.expiringSoon}" class="badge badge-green" th:text="#{pharmacy.stock.ok}">OK</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
