<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{pharmacy.detail.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${success}" class="alert alert-info" th:text="${success}">OK</div>

<div class="panel">
    <div class="panel-header">
        <span th:text="#{pharmacy.detail.heading} + ' #' + ${dispensation.id}">Dispensation #1</span>
        <a th:href="@{/pharmacy/dispensations}" class="btn btn-ghost btn-sm" th:text="#{pharmacy.detail.back_history}">← Historique</a>
    </div>

    <div style="padding:16px 20px; display:grid; grid-template-columns:repeat(2,1fr); gap:12px;">
        <div><span class="text-muted" th:text="#{pharmacy.detail.patient}">Patient :</span>
            <strong th:text="${dispensation.patientName}">Patient</strong>
            <span th:if="${dispensation.patientRecordNumber}" class="text-muted"
                  th:text="' · ' + ${dispensation.patientRecordNumber}"></span>
        </div>
        <div><span class="text-muted" th:text="#{pharmacy.detail.date}">Date :</span>
            <strong th:text="${#temporals.format(dispensation.dispensedAt,'dd/MM/yyyy HH:mm')}">01/01 09:00</strong>
        </div>
        <div><span class="text-muted" th:text="#{pharmacy.detail.prescription}">Ordonnance :</span>
            <span th:if="${dispensation.prescriptionNumber}" class="badge badge-blue"
                  th:text="${dispensation.prescriptionNumber}">ORD</span>
            <span th:unless="${dispensation.prescriptionNumber}" th:text="#{pharmacy.dispensations.walk_in}">Vente libre</span>
        </div>
        <div><span class="text-muted" th:text="#{pharmacy.detail.pharmacist}">Pharmacien :</span>
            <strong th:text="${dispensation.pharmacistName ?: '—'}">Pharmacien</strong>
        </div>
        <div th:if="${dispensation.notes}" style="grid-column:1/3;">
            <span class="text-muted" th:text="#{pharmacy.detail.note}">Note :</span> <span th:text="${dispensation.notes}">Note</span>
        </div>
    </div>
</div>

<div class="panel" style="margin-top:20px;">
    <div class="panel-header"><span th:text="#{pharmacy.detail.lines_heading}">Lignes dispensées</span></div>
    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{pharmacy.col.drug}">Médicament</th>
                <th scope="col" th:text="#{pharmacy.stock.col_batch}">Lot</th>
                <th scope="col" style="text-align:right;" th:text="#{pharmacy.col.quantity}">Quantité</th>
                <th scope="col" style="text-align:right;" th:text="#{pharmacy.detail.col_unit_price}">Prix unitaire</th>
                <th scope="col" style="text-align:right;" th:text="#{pharmacy.detail.col_total}">Total</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="it : ${dispensation.items}">
                <td><strong th:text="${it.drugName}">Médicament</strong></td>
                <td th:text="${it.batchNumber ?: '—'}">LOT</td>
                <td style="text-align:right;" th:text="${it.quantity}">0</td>
                <td style="text-align:right;"
                    th:text="${#numbers.formatDecimal(it.unitPrice,0,'WHITESPACE',0,'POINT')} + ' F'">0 F</td>
                <td style="text-align:right;"
                    th:text="${#numbers.formatDecimal(it.totalPrice,0,'WHITESPACE',0,'POINT')} + ' F'">0 F</td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <td colspan="4" style="text-align:right;"><strong th:text="#{pharmacy.detail.col_total}">Total</strong></td>
                <td style="text-align:right;">
                    <strong th:text="${#numbers.formatDecimal(dispensation.totalAmount,0,'WHITESPACE',0,'POINT')} + ' F'">0 F</strong>
                </td>
            </tr>
            </tfoot>
        </table>
    </div>
</div>

</th:block></body>
</html>
