<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{maternity.list.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${success}" class="alert alert-success" th:text="${success}">OK</div>
<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel">
    <div class="panel-header">
        <span th:text="#{maternity.list.heading}">Dossiers de grossesse</span>
        <a th:href="@{/maternity/new}" class="btn btn-primary btn-sm" th:text="#{maternity.open}">+ Ouvrir un dossier</a>
    </div>

    <form method="get" th:action="@{/maternity}" class="search-bar">
        <select name="status" class="form-control" style="max-width:200px;" onchange="this.form.submit()" th:aria-label="#{common.status}">
            <option value="" th:text="#{maternity.list.all_status}">— Tous statuts —</option>
            <option value="EN_COURS"  th:selected="${status == 'EN_COURS'}"  th:text="#{status.EN_COURS}">En cours</option>
            <option value="ACCOUCHEE" th:selected="${status == 'ACCOUCHEE'}" th:text="#{status.ACCOUCHEE}">Accouchée</option>
            <option value="CLOTURE"   th:selected="${status == 'CLOTURE'}"   th:text="#{status.CLOTURE}">Clôturé</option>
        </select>
    </form>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr><th scope="col" th:text="#{maternity.col.patient}">Patiente</th><th scope="col" th:text="#{maternity.list.col_record}">Dossier</th>
                <th scope="col" th:text="#{maternity.col.followed_by}">Suivi par</th><th scope="col" th:text="#{maternity.col.edd}">DPA</th>
                <th scope="col" th:text="#{maternity.list.col_ga}">Âge gest.</th><th scope="col" th:text="#{common.status}">Statut</th><th scope="col"><span class="sr-only" th:text="#{common.actions}">Actions</span></th></tr>
            </thead>
            <tbody>
            <tr th:if="${records.isEmpty()}">
                <td colspan="7" class="empty-state" th:text="#{maternity.list.empty}">Aucun dossier maternité.</td>
            </tr>
            <tr th:each="r : ${records}">
                <td><strong th:text="${r.patientName}">Patiente</strong></td>
                <td><span class="badge badge-blue" th:text="${r.patientRecordNumber}">PAT-…</span></td>
                <td th:text="${r.doctorName ?: '—'}">—</td>
                <td th:text="${r.expectedDueDate != null ? #temporals.format(r.expectedDueDate,'dd/MM/yyyy') : '—'}">—</td>
                <td th:text="${r.currentGestationalAgeWeeks != null} ? ${r.currentGestationalAgeWeeks} + ' ' + #{maternity.ga_short} : '—'">—</td>
                <td><span class="badge" th:classappend="'badge-' + ${r.status}" th:text="#{${'status.' + r.status}}">EN_COURS</span></td>
                <td><a th:href="@{/maternity/{id}(id=${r.id})}" class="btn btn-ghost btn-sm" th:text="#{common.view}">Voir</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
