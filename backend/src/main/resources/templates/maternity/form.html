<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(${record.id == null} ? #{maternity.form.title_new} : #{maternity.form.title_edit}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<form method="post"
      th:action="${record.id == null} ? @{/maternity/new} : @{/maternity/{id}/edit(id=${record.id})}"
      th:object="${record}">
    <div class="form-card">
        <div class="panel-header"><span th:text="#{maternity.form.heading}">Dossier de grossesse</span></div>

        <div class="form-grid-2">
            <div class="form-group">
                <label class="form-label" for="patientId" th:text="#{maternity.form.patient}">Patiente *</label>
                <select th:if="${record.id == null}" th:field="*{patientId}" class="form-control" required>
                    <option value="" th:text="#{maternity.form.choose_patient}">— Choisir une patiente —</option>
                    <option th:each="p : ${patients}" th:value="${p.id}"
                            th:text="${p.fullName} + ' (' + ${p.recordNumber} + ')'">Patiente</option>
                </select>
                <!-- patiente non modifiable en édition -->
                <div th:if="${record.id != null}">
                    <input type="text" class="form-control" th:value="${record.patientName}" disabled
                           th:aria-label="#{maternity.form.patient}"/>
                    <input type="hidden" th:field="*{patientId}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="doctorId" th:text="#{maternity.col.doctor}">Médecin / sage-femme</label>
                <select th:field="*{doctorId}" class="form-control">
                    <option value="" th:text="#{maternity.no_one}">— Aucun —</option>
                    <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName}">Dr.</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="gravidity" th:text="#{maternity.form.gravidity}">Gravidité (nb grossesses)</label>
                <input type="number" min="0" th:field="*{gravidity}" class="form-control" th:placeholder="#{maternity.form.gravidity_ph}"/>
            </div>
            <div class="form-group">
                <label class="form-label" for="parity" th:text="#{maternity.form.parity}">Parité (nb accouchements)</label>
                <input type="number" min="0" th:field="*{parity}" class="form-control" th:placeholder="#{maternity.form.parity_ph}"/>
            </div>
            <div class="form-group">
                <label class="form-label" for="lastPeriodDate" th:text="#{maternity.form.lmp}">Date des dernières règles (DDR)</label>
                <input type="date" th:field="*{lastPeriodDate}" class="form-control"/>
            </div>
            <div class="form-group">
                <label class="form-label" for="expectedDueDate" th:text="#{maternity.form.edd}">Date probable d'accouchement (DPA)</label>
                <input type="date" th:field="*{expectedDueDate}" class="form-control"/>
                <small class="text-muted" th:text="#{maternity.form.edd_hint}">Calculée à DDR + 280 jours si laissée vide.</small>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="notes" th:text="#{maternity.notes}">Notes</label>
            <textarea th:field="*{notes}" class="form-control" rows="2"
                      th:placeholder="#{maternity.notes_ph}"></textarea>
        </div>

        <div style="display:flex; gap:.5rem; margin-top:12px;">
            <button type="submit" class="btn btn-primary"
                    th:text="${record.id == null} ? #{maternity.form.submit_new} : #{common.save}">Ouvrir le dossier</button>
            <a th:href="${record.id == null} ? @{/maternity} : @{/maternity/{id}(id=${record.id})}"
               class="btn btn-ghost" th:text="#{common.cancel}">Annuler</a>
        </div>
    </div>
</form>

</th:block></body>
</html>
