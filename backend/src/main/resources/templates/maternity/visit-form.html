<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{maternity.visit.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel" style="margin-bottom:12px;">
    <div class="form-grid-2 panel-body">
        <div><span class="detail-label" th:text="#{maternity.col.patient}">Patiente</span> <span th:text="${record.patientName}">—</span></div>
        <div><span class="detail-label" th:text="#{maternity.col.edd}">DPA</span>
             <span th:text="${record.expectedDueDate != null ? #temporals.format(record.expectedDueDate,'dd/MM/yyyy') : '—'}">—</span></div>
    </div>
</div>

<form method="post"
      th:action="${visit.id == null} ? @{/maternity/{id}/visits/new(id=${record.id})} : @{/maternity/{id}/visits/{vid}/edit(id=${record.id},vid=${visit.id})}"
      th:object="${visit}">
    <div class="form-card">
        <div class="panel-header"><span th:text="#{maternity.visit.heading_form}">Consultation prénatale (CPN)</span></div>

        <div class="form-grid-2">
            <div class="form-group">
                <label class="form-label" th:text="#{maternity.visit.number}">N° de CPN *</label>
                <input type="number" min="1" th:field="*{visitNumber}" class="form-control" required/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{maternity.visit.date}">Date de la visite *</label>
                <input type="date" th:field="*{visitDate}" class="form-control" required/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{maternity.col.doctor}">Médecin / sage-femme</label>
                <select th:field="*{doctorId}" class="form-control">
                    <option value="" th:text="#{maternity.no_one}">— Aucun —</option>
                    <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName}">Dr.</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{maternity.visit.ga}">Âge gestationnel (SA)</label>
                <input type="number" min="0" max="45" th:field="*{gestationalAgeWeeks}" class="form-control"
                       th:placeholder="#{maternity.visit.ga_ph}"/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{maternity.visit.weight}">Poids (kg)</label>
                <input type="number" step="0.1" th:field="*{weightKg}" class="form-control"/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{maternity.visit.uh}">Hauteur utérine (cm)</label>
                <input type="number" step="0.1" th:field="*{uterineHeightCm}" class="form-control"/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{maternity.visit.bp_sys}">Tension systolique (mmHg)</label>
                <input type="number" th:field="*{bpSystolic}" class="form-control" th:placeholder="#{maternity.visit.bp_sys_ph}"/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{maternity.visit.bp_dia}">Tension diastolique (mmHg)</label>
                <input type="number" th:field="*{bpDiastolic}" class="form-control" th:placeholder="#{maternity.visit.bp_dia_ph}"/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{maternity.visit.fhr}">Rythme cardiaque fœtal (bpm)</label>
                <input type="number" th:field="*{fetalHeartRate}" class="form-control" th:placeholder="#{maternity.visit.fhr_ph}"/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{maternity.visit.presentation}">Présentation</label>
                <select th:field="*{presentation}" class="form-control">
                    <option value="" th:text="#{common.none}">—</option>
                    <option value="CEPHALIQUE" th:text="#{presentation.CEPHALIQUE}">Céphalique</option>
                    <option value="SIEGE" th:text="#{presentation.SIEGE}">Siège</option>
                    <option value="TRANSVERSE" th:text="#{presentation.TRANSVERSE}">Transverse</option>
                </select>
            </div>
        </div>

        <div class="form-grid-2" style="margin-top:8px;">
            <label class="form-label" style="display:flex; align-items:center; gap:.5rem;">
                <input type="checkbox" th:field="*{edema}"/> <span th:text="#{maternity.visit.edema}">Œdèmes</span>
            </label>
            <label class="form-label" style="display:flex; align-items:center; gap:.5rem;">
                <input type="checkbox" th:field="*{proteinuria}"/> <span th:text="#{maternity.visit.proteinuria}">Protéinurie positive</span>
            </label>
            <label class="form-label" style="display:flex; align-items:center; gap:.5rem;">
                <input type="checkbox" th:field="*{ironSupplemented}"/> <span th:text="#{maternity.visit.iron}">Supplémentation fer / acide folique</span>
            </label>
            <label class="form-label" style="display:flex; align-items:center; gap:.5rem;">
                <input type="checkbox" th:field="*{ttvVaccine}"/> <span th:text="#{maternity.visit.vat}">Vaccin antitétanique (VAT)</span>
            </label>
        </div>

        <div class="form-group" style="margin-top:8px;">
            <label class="form-label" th:text="#{maternity.visit.observations}">Observations</label>
            <textarea th:field="*{observations}" class="form-control" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label" th:text="#{maternity.visit.recommendations}">Recommandations</label>
            <textarea th:field="*{recommendations}" class="form-control" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label" th:text="#{maternity.visit.next_date}">Date de la prochaine visite</label>
            <input type="date" th:field="*{nextVisitDate}" class="form-control"/>
        </div>

        <div style="display:flex; gap:.5rem; margin-top:12px;">
            <button type="submit" class="btn btn-primary" th:text="#{maternity.visit.submit}">Enregistrer la CPN</button>
            <a th:href="@{/maternity/{id}(id=${record.id})}" class="btn btn-ghost" th:text="#{common.cancel}">Annuler</a>
        </div>
    </div>
</form>

</th:block></body>
</html>
