<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{hospitalization.beds.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${success}" class="alert alert-success" th:text="${success}">OK</div>
<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel">
    <div class="panel-header">
        <span th:text="#{hospitalization.beds.heading}">Plan des lits — occupation en temps réel</span>
        <a th:href="@{/hospitalization/admit}" class="btn btn-primary btn-sm" th:text="#{hospitalization.admit_patient}">+ Admettre un patient</a>
    </div>

    <div class="panel-body">
        <div th:if="${board.isEmpty()}" class="empty-state" th:text="#{hospitalization.beds.empty}">
            Aucune chambre active. Créez des chambres dans le référentiel.
        </div>

        <div th:each="dept : ${board}" style="margin-bottom:22px;">
            <div style="display:flex; align-items:center; gap:.5rem; margin-bottom:10px;">
                <span style="display:inline-block; width:12px; height:12px; border-radius:3px;"
                      th:style="'background:' + (${dept.color} ?: '#94a3b8')"></span>
                <strong th:text="${dept.departmentName}">Service</strong>
                <span class="badge" th:text="${dept.freeBeds} + ' / ' + ${dept.totalBeds} + ' ' + #{hospitalization.beds.free_beds}">0 / 0</span>
            </div>

            <div class="bed-grid">
                <div th:each="room : ${dept.rooms}" class="bed-card"
                     th:classappend="${room.full} ? 'bed-occupied' : 'bed-free'">
                    <div class="bed-card-head">
                        <strong th:text="#{hospitalization.room_prefix} + ${room.roomNumber}">Ch. 101</strong>
                        <span class="badge" th:text="${room.type != null} ? #{${'roomtype.' + room.type}} : #{common.none}">STANDARD</span>
                    </div>
                    <div class="bed-card-status">
                        <span th:if="${room.occupiedCount == 0}" class="badge badge-green">🟢 <span th:text="#{hospitalization.beds.free}">LIBRE</span></span>
                        <span th:unless="${room.occupiedCount == 0}" class="badge badge-red"
                              th:text="${room.occupiedCount} + '/' + ${room.capacity} + ' ' + #{hospitalization.beds.occupied}">occupé</span>
                    </div>
                    <ul class="bed-occupants">
                        <li th:each="occ : ${room.occupants}">
                            <a th:href="@{/hospitalization/{id}(id=${occ.id})}" th:text="${occ.patientName}">M. Diop</a>
                            <span class="badge badge-blue" th:text="#{hospitalization.beds.day_prefix} + ${occ.daysSinceAdmission}">J+0</span>
                        </li>
                    </ul>
                    <a th:if="${!room.full}" th:href="@{/hospitalization/admit(roomId=${room.id})}"
                       class="btn btn-ghost btn-sm" style="margin-top:6px;" th:text="#{hospitalization.admit_short}">+ Admettre</a>
                </div>
            </div>
        </div>
    </div>
</div>

</th:block></body>
</html>
