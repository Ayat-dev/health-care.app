<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(${room.id == null} ? #{hospitalization.room_form.title_new} : #{hospitalization.room_form.title_edit}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="form-card">
    <form method="post" th:object="${room}"
          th:action="${room.id == null ? '/hospitalization/rooms/new' : '/hospitalization/rooms/' + room.id + '/edit'}">

        <div class="form-grid-2">
            <div class="form-group">
                <label class="form-label" th:text="#{hospitalization.room_form.number}">Numéro de chambre *</label>
                <input type="text" th:field="*{roomNumber}" class="form-control" placeholder="101" required/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{hospitalization.room_form.department}">Service</label>
                <select th:field="*{departmentId}" class="form-control">
                    <option value="" th:text="#{hospitalization.room_form.no_department}">— Aucun —</option>
                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}">Médecine générale</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{hospitalization.room_form.type}">Type *</label>
                <select th:field="*{type}" class="form-control">
                    <option value="STANDARD" th:text="#{roomtype.STANDARD}">Standard</option>
                    <option value="PRIVE" th:text="#{roomtype.PRIVE}">Privée</option>
                    <option value="SOINS_INTENSIFS" th:text="#{roomtype.SOINS_INTENSIFS}">Soins intensifs</option>
                    <option value="MATERNITE" th:text="#{roomtype.MATERNITE}">Maternité</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{hospitalization.room_form.capacity}">Capacité (lits) *</label>
                <input type="number" th:field="*{capacity}" class="form-control" min="1" value="1" required/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{hospitalization.room_form.rate}">Tarif journalier (F) *</label>
                <input type="number" th:field="*{dailyRate}" class="form-control" min="0" step="0.01" required/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{common.status}">Statut</label>
                <select th:field="*{active}" class="form-control">
                    <option value="true" th:text="#{hospitalization.rooms.active}">Active</option>
                    <option value="false" th:text="#{hospitalization.rooms.inactive}">Désactivée</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" th:text="#{hospitalization.notes}">Notes</label>
            <textarea th:field="*{notes}" class="form-control" rows="2"></textarea>
        </div>

        <div class="form-actions">
            <a th:href="@{/hospitalization/rooms}" class="btn btn-ghost" th:text="#{common.cancel}">Annuler</a>
            <button type="submit" class="btn btn-primary">
                <span th:text="${room.id == null} ? #{hospitalization.room_form.create} : #{common.save}">Créer</span>
            </button>
        </div>
    </form>
</div>

</th:block></body>
</html>
