<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{hospitalization.admit.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<form method="post" th:action="@{/hospitalization/admit}" th:object="${stay}">
    <div class="form-card">
        <div class="panel-header"><span th:text="#{hospitalization.admit.heading}">Nouvelle admission</span></div>

        <div class="form-grid-2">
            <div class="form-group">
                <label class="form-label" for="patientId" th:text="#{hospitalization.admit.patient}">Patient *</label>
                <select th:field="*{patientId}" class="form-control" required>
                    <option value="" th:text="#{hospitalization.choose_patient}">— Choisir un patient —</option>
                    <option th:each="p : ${patients}" th:value="${p.id}"
                            th:text="${p.fullName} + ' (' + ${p.recordNumber} + ')'">Patient</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="doctorId" th:text="#{hospitalization.admit.doctor}">Médecin responsable *</label>
                <select th:field="*{doctorId}" class="form-control" required>
                    <option value="" th:text="#{hospitalization.choose_doctor}">— Choisir un médecin —</option>
                    <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName}">Dr.</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="roomId" th:text="#{hospitalization.admit.room}">Chambre *</label>
                <select th:field="*{roomId}" class="form-control" required>
                    <option value="" th:text="#{hospitalization.choose_room}">— Choisir une chambre —</option>
                    <option th:each="r : ${rooms}" th:value="${r.id}" th:disabled="${r.full}"
                            th:text="#{hospitalization.room_prefix} + ${r.roomNumber} + ' — ' + ${r.departmentName ?: #messages.msg('hospitalization.no_department')}
                                     + ' (' + ${r.availableCount} + ' ' + #{hospitalization.free_one} + ', '
                                     + ${#numbers.formatDecimal(r.dailyRate,1,'WHITESPACE',0,'POINT')} + ' ' + #{hospitalization.admit.per_night} + ')'">Ch. 101</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="admissionReason" th:text="#{hospitalization.admit.reason}">Motif d'admission *</label>
                <input type="text" th:field="*{admissionReason}" class="form-control"
                       th:placeholder="#{hospitalization.admit.reason_ph}" required/>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="notes" th:text="#{hospitalization.notes}">Notes</label>
            <textarea th:field="*{notes}" class="form-control" rows="2" th:placeholder="#{hospitalization.admit.notes_ph}"></textarea>
        </div>

        <div style="display:flex; gap:.5rem; margin-top:12px;">
            <button type="submit" class="btn btn-primary" th:text="#{hospitalization.admit.submit}">Admettre</button>
            <a th:href="@{/hospitalization}" class="btn btn-ghost" th:text="#{common.cancel}">Annuler</a>
        </div>
    </div>
</form>

</th:block></body>
</html>
