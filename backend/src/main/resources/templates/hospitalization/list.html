<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{hospitalization.list.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${success}" class="alert alert-success" th:text="${success}">OK</div>
<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel">
    <div class="panel-header">
        <span th:text="#{hospitalization.list.heading}">Séjours hospitaliers</span>
        <a th:href="@{/hospitalization/admit}" class="btn btn-primary btn-sm" th:text="#{hospitalization.admit_patient}">+ Admettre un patient</a>
    </div>

    <form method="get" th:action="@{/hospitalization/list}" class="search-bar">
        <select name="status" class="form-control" style="max-width:200px;" th:aria-label="#{common.status}">
            <option value="" th:text="#{hospitalization.list.all_statuses}">— Tous statuts —</option>
            <option value="ADMIS" th:selected="${status == 'ADMIS'}" th:text="#{status.ADMIS}">Admis</option>
            <option value="TRANSFERE" th:selected="${status == 'TRANSFERE'}" th:text="#{status.TRANSFERE}">Transféré</option>
            <option value="SORTI" th:selected="${status == 'SORTI'}" th:text="#{status.SORTI}">Sorti</option>
            <option value="DECEDE" th:selected="${status == 'DECEDE'}" th:text="#{status.DECEDE}">Décédé</option>
        </select>
        <button type="submit" class="btn btn-primary btn-sm" th:text="#{common.filter}">Filtrer</button>
    </form>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{hospitalization.col.patient}">Patient</th>
                <th scope="col" th:text="#{hospitalization.col.room}">Chambre</th>
                <th scope="col" th:text="#{hospitalization.col.doctor}">Médecin</th>
                <th scope="col" th:text="#{hospitalization.col.admitted}">Admis le</th>
                <th scope="col" th:text="#{hospitalization.col.discharge}">Sortie</th>
                <th scope="col" th:text="#{hospitalization.col.duration}">Durée</th>
                <th scope="col" th:text="#{common.status}">Statut</th>
                <th scope="col" th:text="#{common.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${stays.isEmpty()}">
                <td colspan="8" class="empty-state" th:text="#{hospitalization.list.empty}">Aucun séjour.</td>
            </tr>
            <tr th:each="s : ${stays}">
                <td>
                    <span th:text="${s.patientName}">Patient</span>
                    <span class="badge badge-blue" th:text="${s.patientRecordNumber}">PAT-…</span>
                </td>
                <td>
                    <span th:text="#{hospitalization.room_prefix} + ${s.roomNumber}">Ch. 101</span>
                    <small th:text="${s.departmentName ?: ''}">Service</small>
                </td>
                <td th:text="${s.doctorName ?: '—'}">Médecin</td>
                <td th:text="${#temporals.format(s.admissionDate,'dd/MM/yyyy HH:mm')}">01/01 09:00</td>
                <td th:text="${s.dischargeDate != null ? #temporals.format(s.dischargeDate,'dd/MM/yyyy HH:mm') : '—'}">—</td>
                <td th:text="${s.nights} + ' ' + #{hospitalization.nights}">1 nuit(s)</td>
                <td><span class="badge" th:classappend="'badge-' + ${s.status}" th:text="#{${'status.' + s.status}}">ADMIS</span></td>
                <td><a th:href="@{/hospitalization/{id}(id=${s.id})}" class="btn btn-ghost btn-sm" th:text="#{common.view}">Voir</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
