<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(${appointment.id == null} ? #{appointments.form.title_new} : #{appointments.form.title_edit}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="form-card">
    <form th:action="${appointment.id == null ? '/appointments/new' : '/appointments/' + appointment.id + '/edit'}"
          method="post">

        <div class="form-section">
            <h3 class="form-section-title" th:text="#{appointments.form.section}">Rendez-vous</h3>
            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label" for="patientId"><span th:text="#{appointments.form.patient}">Patient</span> *</label>
                    <select id="patientId" name="patientId" class="form-control" required>
                        <option value="" th:text="#{appointments.form.select}">— Sélectionner —</option>
                        <option th:each="p : ${patients}" th:value="${p.id}"
                                th:text="${p.lastName + ' ' + p.firstName + ' (' + p.recordNumber + ')'}"
                                th:selected="${appointment.patientId == p.id}">Patient</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="doctorId"><span th:text="#{appointments.form.doctor}">Médecin</span> *</label>
                    <select id="doctorId" name="doctorId" class="form-control" required>
                        <option value="" th:text="#{appointments.form.select}">— Sélectionner —</option>
                        <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName}"
                                th:selected="${appointment.doctorId == d.id}">Dr.</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="startTime"><span th:text="#{appointments.form.start}">Début</span> *</label>
                    <input type="datetime-local" id="startTime" name="startTime" class="form-control" required
                           th:value="${appointment.startTime != null ? #temporals.format(appointment.startTime,'yyyy-MM-dd''T''HH:mm') : ''}"/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="endTime"><span th:text="#{appointments.form.end}">Fin</span> <small th:text="#{appointments.form.end_hint}">(par défaut : +30 min)</small></label>
                    <input type="datetime-local" id="endTime" name="endTime" class="form-control"
                           th:value="${appointment.endTime != null ? #temporals.format(appointment.endTime,'yyyy-MM-dd''T''HH:mm') : ''}"/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="type" th:text="#{appointments.form.type}">Type</label>
                    <select id="type" name="type" class="form-control">
                        <option value="" th:text="#{appointments.form.select}">— Sélectionner —</option>
                        <option value="CONSULTATION" th:selected="${appointment.type == 'CONSULTATION'}" th:text="#{apptype.CONSULTATION}">Consultation</option>
                        <option value="SUIVI" th:selected="${appointment.type == 'SUIVI'}" th:text="#{apptype.SUIVI}">Suivi</option>
                        <option value="URGENCE" th:selected="${appointment.type == 'URGENCE'}" th:text="#{apptype.URGENCE}">Urgence</option>
                        <option value="TELECONSULTATION" th:selected="${appointment.type == 'TELECONSULTATION'}" th:text="#{apptype.TELECONSULTATION}">Téléconsultation</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="status" th:text="#{common.status}">Statut</label>
                    <select id="status" name="status" class="form-control">
                        <option value="PLANIFIE" th:selected="${appointment.status == 'PLANIFIE'}" th:text="#{status.PLANIFIE}">Planifié</option>
                        <option value="CONFIRME" th:selected="${appointment.status == 'CONFIRME'}" th:text="#{status.CONFIRME}">Confirmé</option>
                        <option value="EN_COURS" th:selected="${appointment.status == 'EN_COURS'}" th:text="#{status.EN_COURS}">En cours</option>
                        <option value="TERMINE" th:selected="${appointment.status == 'TERMINE'}" th:text="#{status.TERMINE}">Terminé</option>
                        <option value="ABSENT" th:selected="${appointment.status == 'ABSENT'}" th:text="#{status.ABSENT}">Absent</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="reason" th:text="#{appointments.form.reason}">Motif</label>
                <input type="text" id="reason" name="reason" th:value="${appointment.reason}" class="form-control"/>
            </div>
            <div class="form-group">
                <label class="form-label" for="notes" th:text="#{appointments.form.notes}">Notes</label>
                <textarea id="notes" name="notes" class="form-control" rows="2" th:text="${appointment.notes}"></textarea>
            </div>
        </div>

        <div class="form-actions">
            <a th:href="@{/appointments}" class="btn btn-ghost" th:text="#{common.cancel}">Annuler</a>
            <button type="submit" class="btn btn-primary">
                <span th:text="${appointment.id == null} ? #{appointments.form.submit_create} : #{common.save}">Créer</span>
            </button>
        </div>
    </form>
</div>

</th:block></body>
</html>
