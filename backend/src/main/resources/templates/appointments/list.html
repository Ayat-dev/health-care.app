<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{appointments.list.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${success}" class="alert alert-info" th:text="${success}">OK</div>
<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel">
    <div class="panel-header">
        <span th:text="#{appointments.list.heading}">Agenda du jour</span>
        <div style="display:flex; gap:.5rem; align-items:center;">
            <a th:href="@{/appointments/week(date=${date},doctorId=${selectedDoctorId})}" class="btn btn-ghost btn-sm" th:text="#{appointments.list.view_week}">Vue semaine</a>
            <a th:href="@{/appointments/export/preview(from=${date},to=${date},doctorId=${selectedDoctorId})}" class="btn btn-ghost btn-sm"><svg class="icon-inline" aria-hidden="true"><use href="#ic-file-excel"></use></svg> <span th:text="#{reports.action.excel}">Excel</span></a>
            <a th:href="@{/appointments/new}" class="btn btn-primary btn-sm" th:text="#{appointments.list.new}">+ Nouveau RDV</a>
        </div>
    </div>

    <!-- Barre de navigation date + filtre médecin -->
    <form method="get" th:action="@{/appointments}" class="search-bar">
        <a th:href="@{/appointments(date=${prevDay},doctorId=${selectedDoctorId})}" class="btn btn-ghost btn-sm" th:text="#{appointments.list.prev_day}">← Veille</a>
        <input type="date" name="date" th:value="${date}" class="form-control" style="max-width:180px;"
               th:aria-label="#{common.date}"/>
        <a th:href="@{/appointments(date=${nextDay},doctorId=${selectedDoctorId})}" class="btn btn-ghost btn-sm" th:text="#{appointments.list.next_day}">Lendemain →</a>
        <a th:href="@{/appointments(date=${today},doctorId=${selectedDoctorId})}" class="btn btn-ghost btn-sm" th:text="#{appointments.list.today}">Aujourd'hui</a>

        <select name="doctorId" class="form-control" style="max-width:240px;" onchange="this.form.submit()"
                th:aria-label="#{appointments.list.col_doctor}">
            <option value="" th:text="#{appointments.list.all_doctors}">— Tous les médecins —</option>
            <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName}"
                    th:selected="${selectedDoctorId != null and selectedDoctorId == d.id}">Dr.</option>
        </select>
        <button type="submit" class="btn btn-primary btn-sm" th:text="#{appointments.list.filter}">Filtrer</button>
    </form>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{appointments.list.col_time}">Heure</th>
                <th scope="col" th:text="#{appointments.list.col_patient}">Patient</th>
                <th scope="col" th:text="#{appointments.list.col_doctor}">Médecin</th>
                <th scope="col" th:text="#{appointments.list.col_type}">Type</th>
                <th scope="col" th:text="#{appointments.list.col_reason}">Motif</th>
                <th scope="col" th:text="#{common.status}">Statut</th>
                <th scope="col" th:text="#{common.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${appointments.isEmpty()}">
                <td colspan="7" class="empty-state" th:text="#{appointments.list.empty}">Aucun rendez-vous pour cette journée.</td>
            </tr>
            <tr th:each="a : ${appointments}">
                <td>
                    <strong th:text="${#temporals.format(a.startTime,'HH:mm')}">08:00</strong>
                    <span th:text="'– ' + ${#temporals.format(a.endTime,'HH:mm')}">– 08:30</span>
                </td>
                <td th:text="${a.patient != null ? a.patient.fullName : '—'}">Patient</td>
                <td th:text="${a.doctor != null ? a.doctor.fullName : '—'}">Médecin</td>
                <td th:text="${a.type != null} ? #{${'apptype.' + a.type}} : #{common.none}">CONSULTATION</td>
                <td th:text="${a.reason ?: '—'}">Motif</td>
                <td><span class="badge" th:classappend="'badge-' + ${a.status}" th:text="#{${'status.' + a.status}}">PLANIFIE</span></td>
                <td style="white-space:nowrap;">
                    <a th:href="@{/appointments/{id}/edit(id=${a.id})}" class="btn btn-ghost btn-sm" th:text="#{common.edit}">Modifier</a>
                    <!-- Télémédecine (P3.7) -->
                    <a th:if="${a.type == 'TELECONSULTATION'}" th:href="@{/teleconsultation/{id}(id=${a.id})}"
                       target="_blank" class="btn btn-success btn-sm" th:text="#{appointments.list.join}">📹 Rejoindre</a>
                    <form th:if="${a.type != 'TELECONSULTATION' and a.status != 'ANNULE' and a.status != 'TERMINE'}"
                          method="post" th:action="@{/appointments/{id}/teleconsultation(id=${a.id})}" style="display:inline;">
                        <button class="btn btn-ghost btn-sm" th:text="#{appointments.list.teleconsultation}">📹 Téléconsultation</button>
                    </form>
                    <form th:if="${a.status == 'PLANIFIE'}" method="post"
                          th:action="@{/appointments/{id}/confirm(id=${a.id})}" style="display:inline;">
                        <button class="btn btn-ghost btn-sm" th:text="#{common.confirm}">Confirmer</button>
                    </form>
                    <form th:if="${a.status == 'PLANIFIE' or a.status == 'CONFIRME'}" method="post"
                          th:action="@{/appointments/{id}/start(id=${a.id})}" style="display:inline;">
                        <button class="btn btn-ghost btn-sm" th:text="#{appointments.list.start}">Démarrer</button>
                    </form>
                    <form th:if="${a.status == 'EN_COURS'}" method="post"
                          th:action="@{/appointments/{id}/complete(id=${a.id})}" style="display:inline;">
                        <button class="btn btn-ghost btn-sm" th:text="#{appointments.list.complete}">Terminer</button>
                    </form>
                    <form th:if="${a.status == 'PLANIFIE' or a.status == 'CONFIRME'}" method="post"
                          th:action="@{/appointments/{id}/absent(id=${a.id})}" style="display:inline;">
                        <button class="btn btn-ghost btn-sm" th:text="#{appointments.list.absent}">Absent</button>
                    </form>
                    <form th:if="${a.status != 'ANNULE' and a.status != 'TERMINE'}" method="post"
                          th:action="@{/appointments/{id}/cancel(id=${a.id})}" style="display:inline;"
                          th:onsubmit="'return confirm(\'' + #{appointments.list.cancel_confirm} + '\');'">
                        <button class="btn btn-ghost btn-sm" th:text="#{common.cancel}">Annuler</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
