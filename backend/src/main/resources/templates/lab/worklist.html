<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{lab.worklist.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${success}" class="alert alert-success" th:text="${success}">OK</div>
<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel" data-worklist-topic="/topic/worklist/lab">
    <div class="panel-header">
        <span th:text="#{lab.worklist.heading}">Travail du jour — demandes en attente</span>
        <a sec:authorize="hasRole('MEDECIN')" th:href="@{/lab/requests/new}" class="btn btn-primary btn-sm" th:text="#{lab.action.new}">+ Nouvelle demande</a>
    </div>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{lab.col.number}">N°</th>
                <th scope="col" th:text="#{lab.col.priority}">Priorité</th>
                <th scope="col" th:text="#{lab.col.patient}">Patient</th>
                <th scope="col" th:text="#{lab.col.prescriber}">Prescripteur</th>
                <th scope="col" th:text="#{lab.col.tests}">Analyses</th>
                <th scope="col" th:text="#{lab.col.requested_at}">Demandé le</th>
                <th scope="col" th:text="#{common.status}">Statut</th>
                <th scope="col" th:text="#{common.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${requests.isEmpty()}">
                <td colspan="8" class="empty-state" th:text="#{lab.worklist.empty}">Aucune demande en attente. 🎉</td>
            </tr>
            <tr th:each="r : ${requests}">
                <td><strong th:text="${r.requestNumber}">LAB-…</strong></td>
                <td>
                    <span th:if="${r.priority == 'URGENT'}" class="badge badge-red" th:text="#{priority.URGENT}">URGENT</span>
                    <span th:unless="${r.priority == 'URGENT'}" class="badge" th:text="#{priority.NORMAL}">Normal</span>
                </td>
                <td>
                    <span th:text="${r.patientName}">Patient</span>
                    <span class="badge badge-blue" th:text="${r.patientRecordNumber}">PAT-…</span>
                </td>
                <td th:text="${r.doctorName ?: '—'}">Médecin</td>
                <td>
                    <span th:each="it,iter : ${r.items}"
                          th:text="${it.testCode} + (${iter.last} ? '' : ', ')">NFS</span>
                </td>
                <td th:text="${#temporals.format(r.requestedAt,'dd/MM/yyyy HH:mm')}">01/01 09:00</td>
                <td><span class="badge" th:classappend="'badge-' + ${r.status}" th:text="#{${'status.' + r.status}}">EN_ATTENTE</span></td>
                <td style="white-space:nowrap;">
                    <a sec:authorize="hasRole('LABORANTIN')" th:href="@{/lab/requests/{id}/results(id=${r.id})}" class="btn btn-primary btn-sm" th:text="#{lab.action.enter_results}">Saisir</a>
                    <a th:href="@{/lab/requests/{id}(id=${r.id})}" class="btn btn-ghost btn-sm" th:text="#{common.view}">Voir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
