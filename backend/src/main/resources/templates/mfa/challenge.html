<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{mfa.challenge.title}">Vérification en deux étapes</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
               background:#f1f5f9; font-family:'Inter', sans-serif; }
        .mfa-wrapper { width:100%; max-width:400px; padding:24px; }
        .mfa-logo { text-align:center; margin-bottom:24px; }
        .mfa-logo h1 { font-size:26px; font-weight:700; color:#2563eb; margin:0 0 4px; }
        .mfa-logo p { color:#64748b; font-size:14px; margin:0; }
        .mfa-card { background:#fff; border-radius:12px; padding:32px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
        .mfa-card .form-label { display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:6px; }
        .mfa-card .form-control { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #d1d5db;
               border-radius:6px; font-size:18px; letter-spacing:.25em; text-align:center; outline:none; }
        .mfa-card .form-control:focus { border-color:#2563eb; }
        .mfa-btn { width:100%; padding:11px; background:#2563eb; color:#fff; border:none; border-radius:6px;
               font-size:15px; font-weight:600; cursor:pointer; margin-top:14px; }
        .mfa-hint { color:#64748b; font-size:13px; margin:0 0 16px; }
        .mfa-logout { text-align:center; margin-top:18px; font-size:13px; }
        .alert-error { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; border-radius:6px;
               padding:10px 14px; font-size:13px; margin-bottom:16px; }
    </style>
</head>
<body>
<svg th:replace="~{fragments/icons :: sprite}"></svg>
<div class="mfa-wrapper">
    <div class="mfa-logo">
        <h1>ClinicApp</h1>
        <p th:text="#{mfa.challenge.title}">Vérification en deux étapes</p>
    </div>
    <div class="mfa-card">
        <div class="alert-error" role="alert" th:if="${error}" th:text="${error}">Code invalide.</div>
        <p class="mfa-hint" th:text="#{mfa.challenge.hint}">Saisissez le code de votre application d'authentification.</p>
        <form th:action="@{/mfa/challenge}" method="post">
            <div>
                <label class="form-label" for="code" th:text="#{mfa.challenge.code}">Code de vérification</label>
                <input class="form-control" type="text" id="code" name="code" inputmode="numeric"
                       autocomplete="one-time-code" autofocus required
                       th:placeholder="#{mfa.challenge.placeholder}"/>
            </div>
            <button type="submit" class="mfa-btn" th:text="#{mfa.challenge.submit}">Vérifier</button>
        </form>
        <div class="mfa-logout">
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-ghost btn-sm" th:text="#{layout.logout}">Déconnexion</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
