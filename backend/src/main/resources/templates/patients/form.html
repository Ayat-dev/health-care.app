<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(${patient.id == null} ? #{patients.form.title_new} : #{patients.form.title_edit}, ~{::content})}">
<body><th:block th:fragment="content">

<div class="form-card">
    <form th:action="${patient.id == null ? '/patients/new' : '/patients/' + patient.id + '/edit'}"
          method="post">

        <!-- Informations personnelles -->
        <div class="form-section">
            <h3 class="form-section-title" th:text="#{patients.form.section_personal}">Informations personnelles</h3>
            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label" for="firstName" th:text="#{patients.form.firstname} + ' *'">Prénom *</label>
                    <input type="text" id="firstName" name="firstName" th:value="${patient.firstName}"
                           class="form-control" required/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="lastName" th:text="#{patients.form.lastname} + ' *'">Nom *</label>
                    <input type="text" id="lastName" name="lastName" th:value="${patient.lastName}"
                           class="form-control" required/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="birthDate" th:text="#{patients.form.birthdate}">Date de naissance</label>
                    <input type="date" id="birthDate" name="birthDate" th:value="${patient.birthDate}"
                           class="form-control"/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="gender" th:text="#{patients.form.gender}">Genre</label>
                    <select id="gender" name="gender" class="form-control">
                        <option value="" th:text="#{patients.form.gender_select}">— Sélectionner —</option>
                        <option value="M" th:selected="${patient.gender == 'M'}" th:text="#{patients.form.gender_m}">Masculin</option>
                        <option value="F" th:selected="${patient.gender == 'F'}" th:text="#{patients.form.gender_f}">Féminin</option>
                        <option value="AUTRE" th:selected="${patient.gender == 'AUTRE'}" th:text="#{patients.form.gender_other}">Autre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone" th:text="#{patients.form.phone} + ' *'">Téléphone *</label>
                    <input type="tel" id="phone" name="phone" th:value="${patient.phone}"
                           class="form-control" required/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="phoneAlt" th:text="#{patients.form.phone_alt}">Téléphone alternatif</label>
                    <input type="tel" id="phoneAlt" name="phoneAlt" th:value="${patient.phoneAlt}"
                           class="form-control"/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email" th:text="#{patients.form.email}">Email</label>
                    <input type="email" id="email" name="email" th:value="${patient.email}"
                           class="form-control"/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="nationalId" th:text="#{patients.form.national_id}">N° CNI / Passeport</label>
                    <input type="text" id="nationalId" name="nationalId" th:value="${patient.nationalId}"
                           class="form-control"/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="city" th:text="#{patients.form.city}">Ville</label>
                    <input type="text" id="city" name="city" th:value="${patient.city}"
                           class="form-control"/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="nationality" th:text="#{patients.form.nationality}">Nationalité</label>
                    <input type="text" id="nationality" name="nationality" th:value="${patient.nationality}"
                           class="form-control"/>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="address" th:text="#{patients.form.address}">Adresse</label>
                <textarea id="address" name="address" class="form-control" rows="2"
                          th:text="${patient.address}"></textarea>
            </div>
        </div>

        <!-- Contact urgence -->
        <div class="form-section">
            <h3 class="form-section-title" th:text="#{patients.form.section_emergency}">Contact d'urgence</h3>
            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label" for="emergencyContactName" th:text="#{patients.form.emergency_name}">Nom du contact</label>
                    <input type="text" id="emergencyContactName" name="emergencyContactName"
                           th:value="${patient.emergencyContactName}" class="form-control"/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="emergencyContactPhone" th:text="#{patients.form.emergency_phone}">Téléphone du contact</label>
                    <input type="tel" id="emergencyContactPhone" name="emergencyContactPhone"
                           th:value="${patient.emergencyContactPhone}" class="form-control"/>
                </div>
            </div>
        </div>

        <!-- Informations médicales -->
        <div class="form-section">
            <h3 class="form-section-title" th:text="#{patients.form.section_medical}">Informations médicales</h3>
            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label" for="bloodType" th:text="#{patients.form.blood_type}">Groupe sanguin</label>
                    <select id="bloodType" name="bloodType" class="form-control">
                        <option value="" th:text="#{patients.form.blood_unknown}">— Inconnu —</option>
                        <option th:each="bt : ${ {'A+','A-','B+','B-','AB+','AB-','O+','O-'} }"
                                th:value="${bt}" th:text="${bt}"
                                th:selected="${patient.bloodType == bt}">A+</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="assignedDoctorId" th:text="#{patients.form.doctor}">Médecin référent</label>
                    <select id="assignedDoctorId" name="assignedDoctorId" class="form-control">
                        <option value="" th:text="#{patients.form.doctor_none}">— Aucun —</option>
                        <option th:each="d : ${doctors}"
                                th:value="${d.id}" th:text="${d.fullName}"
                                th:selected="${patient.assignedDoctorId == d.id}">Dr.</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="allergies" th:text="#{patients.form.allergies}">Allergies</label>
                <textarea id="allergies" name="allergies" class="form-control" rows="2"
                          th:text="${patient.allergies}"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label" for="chronicConditions" th:text="#{patients.form.chronic}">Antécédents / Maladies chroniques</label>
                <textarea id="chronicConditions" name="chronicConditions" class="form-control" rows="2"
                          th:text="${patient.chronicConditions}"></textarea>
            </div>
        </div>

        <!-- Actions -->
        <div class="form-actions">
            <a th:href="@{/patients}" class="btn btn-ghost" th:text="#{common.cancel}">Annuler</a>
            <button type="submit" class="btn btn-primary">
                <span th:text="${patient.id == null} ? #{patients.form.submit_create} : #{common.save}">Créer</span>
            </button>
        </div>
    </form>
</div>

</th:block></body>
</html>
