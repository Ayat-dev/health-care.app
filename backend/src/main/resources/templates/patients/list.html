<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{patients.list.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div class="panel">
    <div class="panel-header">
        <span th:text="#{patients.list.heading}">Liste des patients</span>
        <span style="display:flex; gap:.5rem;">
            <a th:href="@{/patients/export(q=${q})}" class="btn btn-ghost btn-sm">⬇ <span th:text="#{reports.action.excel}">Excel</span></a>
            <a sec:authorize="hasAnyRole('MEDECIN','SECRETAIRE','INFIRMIER')" th:href="@{/patients/new}" class="btn btn-primary btn-sm" th:text="#{patients.list.new}">+ Nouveau patient</a>
        </span>
    </div>

    <!-- Barre de recherche -->
    <form method="get" th:action="@{/patients}" class="search-bar">
        <input type="text" name="q" th:value="${q}"
               th:placeholder="#{patients.list.search_placeholder}"
               th:aria-label="#{patients.list.search_placeholder}"
               class="form-control" style="max-width:400px;"/>
        <button type="submit" class="btn btn-primary btn-sm" th:text="#{common.search}">Rechercher</button>
        <a th:if="${q != ''}" th:href="@{/patients}" class="btn btn-ghost btn-sm" th:text="#{patients.list.clear}">✕ Effacer</a>
    </form>

    <!-- Tableau -->
    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{patients.list.col_record}">N° Dossier</th>
                <th scope="col" th:text="#{patients.list.col_name}">Nom complet</th>
                <th scope="col" th:text="#{patients.list.col_phone}">Téléphone</th>
                <th scope="col" th:text="#{patients.list.col_birthdate}">Date naissance</th>
                <th scope="col" th:text="#{patients.list.col_doctor}">Médecin référent</th>
                <th scope="col" th:text="#{common.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${patients.isEmpty()}">
                <td colspan="6" class="empty-state" th:text="#{patients.list.empty}">Aucun patient trouvé.</td>
            </tr>
            <tr th:each="p : ${patients}">
                <td><code th:text="${p.recordNumber}">PAT-2026-00001</code></td>
                <td>
                    <a th:href="@{/patients/{id}(id=${p.id})}"
                       th:text="${p.lastName + ' ' + p.firstName}">Nom</a>
                </td>
                <td th:text="${p.phone}">—</td>
                <td th:text="${p.birthDate != null ? #temporals.format(p.birthDate,'dd/MM/yyyy') : '—'}">—</td>
                <td th:text="${p.assignedDoctor != null ? p.assignedDoctor.fullName : '—'}">—</td>
                <td>
                    <a th:href="@{/patients/{id}(id=${p.id})}" class="btn btn-ghost btn-sm" th:text="#{common.view}">Voir</a>
                    <a th:href="@{/patients/{id}/edit(id=${p.id})}" class="btn btn-ghost btn-sm" th:text="#{common.edit}">Modifier</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="pagination" th:if="${patients.totalPages > 1}">
        <a th:if="${!patients.first}" th:href="@{/patients(q=${q},page=${currentPage-1})}" class="btn btn-ghost btn-sm" th:text="#{patients.list.prev}">← Précédent</a>
        <span th:text="#{patients.list.page(${currentPage}+1, ${patients.totalPages})}">Page 1/1</span>
        <a th:if="${!patients.last}" th:href="@{/patients(q=${q},page=${currentPage+1})}" class="btn btn-ghost btn-sm" th:text="#{patients.list.next}">Suivant →</a>
    </div>
</div>

</th:block></body>
</html>
