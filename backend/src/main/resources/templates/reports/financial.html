<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout('Bilan financier mensuel', ~{::content})}">
<body><th:block th:fragment="content">

<div class="panel-header" style="padding:0 0 12px;">
    <span th:text="'Bilan financier — ' + ${monthName} + ' ' + ${year}">Bilan</span>
    <button onclick="window.print()" class="btn btn-ghost btn-sm">🖨 Imprimer</button>
</div>

<!-- Sélecteur de période -->
<form method="get" th:action="@{/reports/financial}" class="form-card no-print"
      style="display:flex; gap:.75rem; align-items:flex-end; margin-bottom:16px;">
    <div class="form-group" style="margin:0;">
        <label class="form-label">Mois</label>
        <select name="month" class="form-control">
            <option th:each="mm : ${#numbers.sequence(1,12)}" th:value="${mm}"
                    th:text="${mm}" th:selected="${mm == month}">1</option>
        </select>
    </div>
    <div class="form-group" style="margin:0;">
        <label class="form-label">Année</label>
        <input type="number" name="year" class="form-control" th:value="${year}" style="width:120px;"/>
    </div>
    <button type="submit" class="btn btn-primary btn-sm">Afficher</button>
</form>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-card-label">Facturé (part patient)</div>
        <div class="stat-card-value" th:text="${#numbers.formatDecimal(report.totalInvoiced,1,'WHITESPACE',0,'POINT')} + ' ' + ${config.currency}">0</div>
        <div style="font-size:.8rem; color:#64748b; margin-top:4px;" th:text="${report.invoiceCount} + ' facture(s)'">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-label">Encaissé</div>
        <div class="stat-card-value" th:text="${#numbers.formatDecimal(report.totalCollected,1,'WHITESPACE',0,'POINT')} + ' ' + ${config.currency}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-label">Reste à recouvrer</div>
        <div class="stat-card-value" th:text="${#numbers.formatDecimal(report.totalOutstanding,1,'WHITESPACE',0,'POINT')} + ' ' + ${config.currency}">0</div>
    </div>
</div>

<div class="panel" style="margin-top:16px;">
    <div class="panel-header"><span>Encaissements par mode de paiement</span></div>
    <div th:if="${report.collectedByMethod.isEmpty()}" class="empty-state">Aucun encaissement sur la période.</div>
    <div th:unless="${report.collectedByMethod.isEmpty()}" class="table-wrap">
        <table class="table">
            <thead><tr><th>Mode</th><th style="text-align:right;">Montant</th></tr></thead>
            <tbody>
            <tr th:each="m : ${report.collectedByMethod}">
                <td><span class="badge" th:text="${m.key}">ESPECES</span></td>
                <td style="text-align:right;"
                    th:text="${#numbers.formatDecimal(m.value,1,'WHITESPACE',0,'POINT')} + ' ' + ${config.currency}">0</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
