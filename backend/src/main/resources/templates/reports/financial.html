<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{reports.financial.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div class="panel-header" style="padding:0 0 12px;">
    <span th:text="#{reports.financial.heading} + ' ' + ${monthName} + ' ' + ${year}">Bilan</span>
    <span class="no-print">
        <a th:href="@{/reports/financial/pdf(month=${month},year=${year})}" class="btn btn-ghost btn-sm">⬇ <span th:text="#{reports.action.pdf}">PDF</span></a>
        <button onclick="window.print()" class="btn btn-ghost btn-sm">🖨 <span th:text="#{common.print}">Imprimer</span></button>
    </span>
</div>

<!-- Sélecteur de période -->
<form method="get" th:action="@{/reports/financial}" class="form-card no-print"
      style="display:flex; gap:.75rem; align-items:flex-end; margin-bottom:16px;">
    <div class="form-group" style="margin:0;">
        <label class="form-label" for="month" th:text="#{reports.period.month}">Mois</label>
        <select id="month" name="month" class="form-control">
            <option th:each="mm : ${#numbers.sequence(1,12)}" th:value="${mm}"
                    th:text="${mm}" th:selected="${mm == month}">1</option>
        </select>
    </div>
    <div class="form-group" style="margin:0;">
        <label class="form-label" for="year" th:text="#{reports.period.year}">Année</label>
        <input type="number" id="year" name="year" class="form-control" th:value="${year}" style="width:120px;"/>
    </div>
    <button type="submit" class="btn btn-primary btn-sm" th:text="#{reports.period.show}">Afficher</button>
</form>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-card-label" th:text="#{reports.financial.invoiced}">Facturé (part patient)</div>
        <div class="stat-card-value" th:text="${#numbers.formatDecimal(report.totalInvoiced,1,'WHITESPACE',0,'POINT')} + ' ' + ${config.currency}">0</div>
        <div class="text-muted" style="font-size:.8rem; margin-top:4px;" th:text="${report.invoiceCount} + ' ' + #{reports.financial.invoices_count}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-label" th:text="#{reports.financial.collected}">Encaissé</div>
        <div class="stat-card-value" th:text="${#numbers.formatDecimal(report.totalCollected,1,'WHITESPACE',0,'POINT')} + ' ' + ${config.currency}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-label" th:text="#{reports.financial.outstanding}">Reste à recouvrer</div>
        <div class="stat-card-value" th:text="${#numbers.formatDecimal(report.totalOutstanding,1,'WHITESPACE',0,'POINT')} + ' ' + ${config.currency}">0</div>
    </div>
</div>

<div class="panel mt-16">
    <div class="panel-header"><span th:text="#{reports.financial.by_method}">Encaissements par mode de paiement</span></div>
    <div th:if="${report.collectedByMethod.isEmpty()}" class="empty-state" th:text="#{reports.financial.no_payments_period}">Aucun encaissement sur la période.</div>
    <div th:unless="${report.collectedByMethod.isEmpty()}" class="table-wrap">
        <table class="table">
            <thead><tr><th scope="col" th:text="#{reports.col.method}">Mode</th><th scope="col" style="text-align:right;" th:text="#{reports.col.amount}">Montant</th></tr></thead>
            <tbody>
            <tr th:each="m : ${report.collectedByMethod}">
                <td><span class="badge" th:text="${@paymentMethods.label(m.key)}">ESPECES</span></td>
                <td style="text-align:right;"
                    th:text="${#numbers.formatDecimal(m.value,1,'WHITESPACE',0,'POINT')} + ' ' + ${config.currency}">0</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
