<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout('Rapport d’activité', ~{::content})}">
<body><th:block th:fragment="content">

<div class="panel-header" style="padding:0 0 12px;">
    <span th:text="'Activité médicale — ' + ${monthName} + ' ' + ${year}">Activité</span>
    <span class="no-print">
        <a th:href="@{/reports/activity/pdf(month=${month},year=${year})}" class="btn btn-ghost btn-sm">⬇ PDF</a>
        <button onclick="window.print()" class="btn btn-ghost btn-sm">🖨 Imprimer</button>
    </span>
</div>

<form method="get" th:action="@{/reports/activity}" class="form-card no-print"
      style="display:flex; gap:.75rem; align-items:flex-end; margin-bottom:16px;">
    <div class="form-group" style="margin:0;">
        <label class="form-label">Mois</label>
        <select name="month" class="form-control">
            <option th:each="mm : ${#numbers.sequence(1,12)}" th:value="${mm}"
                    th:text="${mm}" th:selected="${mm == month}">1</option>
        </select>
    </div>
    <div class="form-group" style="margin:0;">
        <label class="form-label">Année</label>
        <input type="number" name="year" class="form-control" th:value="${year}" style="width:120px;"/>
    </div>
    <button type="submit" class="btn btn-primary btn-sm">Afficher</button>
</form>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-card-label">Consultations</div>
        <div class="stat-card-value" th:text="${report.consultations}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-label">Rendez-vous</div>
        <div class="stat-card-value" th:text="${report.appointments}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-label">Nouveaux patients</div>
        <div class="stat-card-value" th:text="${report.newPatients}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-label">Demandes labo</div>
        <div class="stat-card-value" th:text="${report.labRequests}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-label">Admissions</div>
        <div class="stat-card-value" th:text="${report.admissions}">0</div>
    </div>
</div>

<div class="panel mt-16">
    <div class="panel-header"><span>Consultations par service</span></div>
    <div th:if="${report.consultationsByDepartment.isEmpty()}" class="empty-state">Aucune consultation sur la période.</div>
    <div th:unless="${report.consultationsByDepartment.isEmpty()}" class="table-wrap">
        <table class="table">
            <thead><tr><th>Département</th><th style="text-align:right;">Consultations</th></tr></thead>
            <tbody>
            <tr th:each="d : ${report.consultationsByDepartment}">
                <td th:text="${d.label}">Médecine générale</td>
                <td style="text-align:right;" th:text="${d.count}">0</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
