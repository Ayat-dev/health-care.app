<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{reports.activity.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div class="panel-header" style="padding:0 0 12px;">
    <span th:text="#{reports.activity.heading} + ' ' + ${monthName} + ' ' + ${year}">Activité</span>
    <span class="no-print">
        <a th:href="@{/reports/activity/pdf(month=${month},year=${year})}" class="btn btn-ghost btn-sm">⬇ <span th:text="#{reports.action.pdf}">PDF</span></a>
        <button onclick="window.print()" class="btn btn-ghost btn-sm">🖨 <span th:text="#{common.print}">Imprimer</span></button>
    </span>
</div>

<form method="get" th:action="@{/reports/activity}" class="form-card no-print"
      style="display:flex; gap:.75rem; align-items:flex-end; margin-bottom:16px;">
    <div class="form-group" style="margin:0;">
        <label class="form-label" for="month" th:text="#{reports.period.month}">Mois</label>
        <select id="month" name="month" class="form-control">
            <option th:each="mm : ${#numbers.sequence(1,12)}" th:value="${mm}"
                    th:text="${mm}" th:selected="${mm == month}">1</option>
        </select>
    </div>
    <div class="form-group" style="margin:0;">
        <label class="form-label" for="year" th:text="#{reports.period.year}">Année</label>
        <input type="number" id="year" name="year" class="form-control" th:value="${year}" style="width:120px;"/>
    </div>
    <button type="submit" class="btn btn-primary btn-sm" th:text="#{reports.period.show}">Afficher</button>
</form>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-card-label" th:text="#{reports.activity.consultations}">Consultations</div>
        <div class="stat-card-value" th:text="${report.consultations}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-label" th:text="#{reports.activity.appointments}">Rendez-vous</div>
        <div class="stat-card-value" th:text="${report.appointments}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-label" th:text="#{reports.activity.new_patients}">Nouveaux patients</div>
        <div class="stat-card-value" th:text="${report.newPatients}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-label" th:text="#{reports.activity.lab_requests}">Demandes labo</div>
        <div class="stat-card-value" th:text="${report.labRequests}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-label" th:text="#{reports.activity.admissions}">Admissions</div>
        <div class="stat-card-value" th:text="${report.admissions}">0</div>
    </div>
</div>

<div class="panel mt-16">
    <div class="panel-header"><span th:text="#{reports.activity.by_department}">Consultations par service</span></div>
    <div th:if="${report.consultationsByDepartment.isEmpty()}" class="empty-state" th:text="#{reports.activity.no_consultations_period}">Aucune consultation sur la période.</div>
    <div th:unless="${report.consultationsByDepartment.isEmpty()}" class="table-wrap">
        <table class="table">
            <thead><tr><th scope="col" th:text="#{reports.col.department}">Département</th><th scope="col" style="text-align:right;" th:text="#{reports.col.consultations}">Consultations</th></tr></thead>
            <tbody>
            <tr th:each="d : ${report.consultationsByDepartment}">
                <td th:text="${d.label}">Médecine générale</td>
                <td style="text-align:right;" th:text="${d.count}">0</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
