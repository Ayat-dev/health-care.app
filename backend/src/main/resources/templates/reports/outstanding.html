<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{reports.outstanding.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div class="panel-header" style="padding:0 0 12px;">
    <span th:text="#{reports.outstanding.title}">Liste des impayés</span>
    <span class="no-print">
        <a th:href="@{/reports/outstanding/excel}" class="btn btn-ghost btn-sm">⬇ <span th:text="#{reports.action.excel}">Excel</span></a>
        <button onclick="window.print()" class="btn btn-ghost btn-sm">🖨 <span th:text="#{common.print}">Imprimer</span></button>
    </span>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-card-label" th:text="#{reports.outstanding.unpaid_count}">Factures impayées</div>
        <div class="stat-card-value" th:text="${report.invoiceCount}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-label" th:text="#{reports.outstanding.total}">Total à recouvrer</div>
        <div class="stat-card-value" th:text="${#numbers.formatDecimal(report.totalOutstanding,1,'WHITESPACE',0,'POINT')} + ' ' + ${config.currency}">0</div>
    </div>
</div>

<div class="panel mt-16">
    <div class="panel-header"><span th:text="#{reports.outstanding.detail}">Détail</span></div>
    <div th:if="${report.invoices.isEmpty()}" class="empty-state" th:text="#{reports.outstanding.none}">Aucune facture impayée. 🎉</div>
    <div th:unless="${report.invoices.isEmpty()}" class="table-wrap">
        <table class="table">
            <thead>
            <tr><th scope="col" th:text="#{reports.col.invoice}">Facture</th><th scope="col" th:text="#{common.date}">Date</th><th scope="col" th:text="#{reports.col.patient}">Patient</th><th scope="col" th:text="#{common.status}">Statut</th>
                <th scope="col" style="text-align:right;" th:text="#{reports.col.patient_amount}">Part patient</th>
                <th scope="col" style="text-align:right;" th:text="#{reports.col.collected}">Encaissé</th>
                <th scope="col" style="text-align:right;" th:text="#{reports.col.balance_due}">Reste dû</th></tr>
            </thead>
            <tbody>
            <tr th:each="inv : ${report.invoices}">
                <td><a th:href="@{/billing/invoices/{id}(id=${inv.id})}" th:text="${inv.invoiceNumber}">FAC-…</a></td>
                <td th:text="${inv.createdAt != null ? #temporals.format(inv.createdAt,'dd/MM/yyyy') : '—'}">—</td>
                <td th:text="${inv.patientName ?: '—'}">Patient</td>
                <td><span class="badge" th:classappend="'badge-' + ${inv.status}" th:text="#{${'status.' + inv.status}}">EN_ATTENTE</span></td>
                <td style="text-align:right;" th:text="${#numbers.formatDecimal(inv.patientAmount,1,'WHITESPACE',0,'POINT')}">0</td>
                <td style="text-align:right;" th:text="${#numbers.formatDecimal(inv.paidAmount,1,'WHITESPACE',0,'POINT')}">0</td>
                <td style="text-align:right;"><strong th:text="${#numbers.formatDecimal(inv.balanceDue,1,'WHITESPACE',0,'POINT')}">0</strong></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
