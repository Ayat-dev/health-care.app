<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{billing.list.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${success}" class="alert alert-success" th:text="${success}">OK</div>
<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel">
    <div class="panel-header">
        <span th:text="#{billing.list.heading}">Factures</span>
        <span style="display:flex; gap:.5rem;">
            <a th:href="@{/billing/invoices/export(from=${from},to=${to},status=${status})}" class="btn btn-ghost btn-sm">⬇ <span th:text="#{reports.action.excel}">Excel</span></a>
            <a th:href="@{/billing/invoices/new}" class="btn btn-primary btn-sm" th:text="#{billing.list.new}">+ Nouvelle facture</a>
        </span>
    </div>

    <form method="get" th:action="@{/billing/invoices}" class="search-bar">
        <input type="date" name="from" th:value="${from}" class="form-control" style="max-width:170px;"
               th:aria-label="#{common.date_from}"/>
        <span>→</span>
        <input type="date" name="to" th:value="${to}" class="form-control" style="max-width:170px;"
               th:aria-label="#{common.date_to}"/>
        <select name="status" class="form-control" style="max-width:180px;"
                th:aria-label="#{common.status}">
            <option value="" th:text="#{billing.list.all_statuses}">— Tous statuts —</option>
            <option value="EN_ATTENTE" th:selected="${status == 'EN_ATTENTE'}" th:text="#{status.EN_ATTENTE}">En attente</option>
            <option value="PARTIEL" th:selected="${status == 'PARTIEL'}" th:text="#{status.PARTIEL}">Partiel</option>
            <option value="PAYE" th:selected="${status == 'PAYE'}" th:text="#{status.PAYE}">Payée</option>
            <option value="ANNULE" th:selected="${status == 'ANNULE'}" th:text="#{status.ANNULE}">Annulée</option>
        </select>
        <button type="submit" class="btn btn-primary btn-sm" th:text="#{common.filter}">Filtrer</button>
    </form>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{billing.col.number}">N°</th>
                <th scope="col" th:text="#{billing.col.patient}">Patient</th>
                <th scope="col" th:text="#{common.date}">Date</th>
                <th scope="col" style="text-align:right;" th:text="#{billing.col.total}">Total</th>
                <th scope="col" style="text-align:right;" th:text="#{billing.col.patient_part}">Part patient</th>
                <th scope="col" style="text-align:right;" th:text="#{billing.col.paid}">Payé</th>
                <th scope="col" style="text-align:right;" th:text="#{billing.col.balance}">Reste</th>
                <th scope="col" th:text="#{common.status}">Statut</th>
                <th scope="col" th:text="#{common.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${invoices.isEmpty()}">
                <td colspan="9" class="empty-state" th:text="#{billing.list.empty}">Aucune facture.</td>
            </tr>
            <tr th:each="inv : ${invoices}">
                <td><strong th:text="${inv.invoiceNumber}">FAC-…</strong></td>
                <td>
                    <span th:text="${inv.patientName}">Patient</span>
                    <small th:text="${inv.patientRecordNumber}">PAT-…</small>
                </td>
                <td th:text="${#temporals.format(inv.createdAt,'dd/MM/yyyy')}">01/01</td>
                <td style="text-align:right;" th:text="${#numbers.formatDecimal(inv.subtotal,1,'WHITESPACE',0,'POINT')}">0</td>
                <td style="text-align:right;" th:text="${#numbers.formatDecimal(inv.patientAmount,1,'WHITESPACE',0,'POINT')}">0</td>
                <td style="text-align:right;" th:text="${#numbers.formatDecimal(inv.paidAmount,1,'WHITESPACE',0,'POINT')}">0</td>
                <td style="text-align:right;">
                    <strong th:classappend="${inv.balanceDue.signum() > 0} ? 'text-danger'"
                            th:text="${#numbers.formatDecimal(inv.balanceDue,1,'WHITESPACE',0,'POINT')}">0</strong>
                </td>
                <td><span class="badge" th:classappend="'badge-' + ${inv.status}" th:text="#{${'status.' + inv.status}}">EN_ATTENTE</span></td>
                <td style="white-space:nowrap;">
                    <a th:href="@{/billing/invoices/{id}(id=${inv.id})}" class="btn btn-ghost btn-sm" th:text="#{common.view}">Voir</a>
                    <a th:if="${inv.status == 'EN_ATTENTE' or inv.status == 'PARTIEL'}"
                       th:href="@{/billing/invoices/{id}/pay(id=${inv.id})}" class="btn btn-primary btn-sm" th:text="#{billing.queue.collect}">Encaisser</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
