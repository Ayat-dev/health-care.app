<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{billing.queue.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${success}" class="alert alert-success" th:text="${success}">OK</div>
<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel" data-worklist-topic="/topic/billing/queue">
    <div class="panel-header">
        <span><span th:text="#{billing.queue.heading}">File d'attente caisse</span> <small th:text="'(' + ${invoices.size()} + ')'">(0)</small></span>
        <div style="display:flex; gap:.5rem;">
            <a th:href="@{/billing/invoices}" class="btn btn-ghost btn-sm" th:text="#{billing.queue.all_invoices}">Toutes les factures</a>
            <a th:href="@{/billing/dashboard}" class="btn btn-ghost btn-sm" th:text="#{billing.queue.dashboard}">Tableau de bord</a>
            <a th:href="@{/billing/invoices/new}" class="btn btn-ghost btn-sm" th:text="#{billing.queue.new_manual}">+ Facture manuelle</a>
        </div>
    </div>

    <div class="search-bar" style="align-items:center;">
        <input type="text" id="patientFilter" class="form-control" autofocus
               th:placeholder="#{billing.queue.search_placeholder}"
               th:aria-label="#{billing.queue.search_placeholder}"
               placeholder="Rechercher un patient (nom ou n° dossier)…" style="max-width:380px;"/>
    </div>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{billing.col.number}">N°</th>
                <th scope="col" th:text="#{billing.col.patient}">Patient</th>
                <th scope="col" th:text="#{common.date}">Date</th>
                <th scope="col" style="text-align:right;" th:text="#{billing.col.to_settle}">À régler</th>
                <th scope="col" style="text-align:right;" th:text="#{billing.col.paid}">Payé</th>
                <th scope="col" style="text-align:right;" th:text="#{billing.col.balance_due}">Reste à payer</th>
                <th scope="col" th:text="#{common.status}">Statut</th>
                <th scope="col" th:text="#{common.actions}">Actions</th>
            </tr>
            </thead>
            <tbody id="queueBody">
            <tr th:if="${invoices.isEmpty()}">
                <td colspan="8" class="empty-state" th:text="#{billing.queue.empty}">Aucune facture en attente d'encaissement. 🎉</td>
            </tr>
            <tr th:each="inv : ${invoices}"
                th:attr="data-patient=${#strings.toLowerCase((inv.patientName ?: '') + ' ' + (inv.patientRecordNumber ?: ''))}">
                <td><strong th:text="${inv.invoiceNumber}">FAC-…</strong></td>
                <td>
                    <span th:text="${inv.patientName}">Patient</span>
                    <small th:text="${inv.patientRecordNumber}">PAT-…</small>
                </td>
                <td th:text="${#temporals.format(inv.createdAt,'dd/MM/yyyy')}">01/01</td>
                <td style="text-align:right;" th:text="${#numbers.formatDecimal(inv.patientAmount,1,'WHITESPACE',0,'POINT')}">0</td>
                <td style="text-align:right;" th:text="${#numbers.formatDecimal(inv.paidAmount,1,'WHITESPACE',0,'POINT')}">0</td>
                <td style="text-align:right;">
                    <strong class="text-danger"
                            th:text="${#numbers.formatDecimal(inv.balanceDue,1,'WHITESPACE',0,'POINT')}">0</strong>
                </td>
                <td><span class="badge" th:classappend="'badge-' + ${inv.status}" th:text="#{${'status.' + inv.status}}">EN_ATTENTE</span></td>
                <td style="white-space:nowrap;">
                    <a th:href="@{/billing/invoices/{id}(id=${inv.id})}" class="btn btn-ghost btn-sm" th:text="#{common.view}">Voir</a>
                    <a th:href="@{/billing/invoices/{id}/pay(id=${inv.id})}" class="btn btn-primary btn-sm" th:text="#{billing.queue.collect}">Encaisser</a>
                </td>
            </tr>
            <tr id="noMatchRow" style="display:none;">
                <td colspan="8" class="empty-state" th:text="#{billing.queue.no_match}">Aucun patient ne correspond à la recherche.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:inline="javascript">
    (function () {
        const input = document.getElementById('patientFilter');
        const rows = Array.from(document.querySelectorAll('#queueBody tr[data-patient]'));
        const noMatch = document.getElementById('noMatchRow');
        if (!input) return;
        input.addEventListener('input', function () {
            const q = input.value.trim().toLowerCase();
            let visible = 0;
            rows.forEach(function (r) {
                const match = !q || r.getAttribute('data-patient').includes(q);
                r.style.display = match ? '' : 'none';
                if (match) visible++;
            });
            if (noMatch) noMatch.style.display = (rows.length > 0 && visible === 0) ? '' : 'none';
        });
    })();
</script>

</th:block></body>
</html>
