<html th:replace="~{portal/layout :: layout(#{portal.appointments.title}, ~{::content})}">
<body><th:block th:fragment="content">

    <div th:if="${success}" class="alert alert-info" th:text="${success}"></div>

    <div class="panel">
        <div class="panel-header">
            <h2 th:text="#{portal.appointments.heading}">Mes rendez-vous</h2>
            <a th:href="@{/portal/appointments/request}" class="btn btn-primary btn-sm" th:text="#{portal.appointments.request}">+ Demander un rendez-vous</a>
        </div>

        <div th:if="${appointments.isEmpty()}" class="empty-state">
            <span th:text="#{portal.appointments.none}">Vous n'avez aucun rendez-vous.</span>
            <a th:href="@{/portal/appointments/request}" th:text="#{portal.home.request_one}">En demander un</a>.
        </div>

        <div th:unless="${appointments.isEmpty()}" class="table-wrap">
            <table class="table">
                <thead>
                <tr><th th:text="#{common.date}">Date</th><th th:text="#{portal.col.doctor}">Médecin</th><th th:text="#{common.type}">Type</th><th th:text="#{portal.col.reason}">Motif</th><th th:text="#{common.status}">Statut</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="a : ${appointments}">
                    <td th:text="${a.startTime != null ? #temporals.format(a.startTime, 'dd/MM/yyyy HH:mm') : '—'}">—</td>
                    <td th:text="${a.doctorName}">—</td>
                    <td th:text="${a.type != null} ? #{${'apptype.' + a.type}} : #{common.none}">—</td>
                    <td th:text="${a.reason}">—</td>
                    <td><span class="badge" th:classappend="'badge-' + ${a.status}" th:text="#{${'status.' + a.status}}">—</span></td>
                    <td>
                        <a th:if="${a.type == 'TELECONSULTATION' and a.status != 'ANNULE'}"
                           th:href="@{/teleconsultation/{id}(id=${a.id})}" target="_blank"
                           class="btn btn-success btn-sm" th:text="#{portal.appointments.join}">📹 Rejoindre</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</th:block></body>
</html>
