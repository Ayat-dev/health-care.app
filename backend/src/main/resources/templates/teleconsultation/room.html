<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{teleconsultation.page_title}">Téléconsultation — ClinicApp</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
               background:#f1f5f9; }
        .tc-wrap { width:100%; max-width:460px; padding:24px; }
        .tc-card { background:#fff; border-radius:14px; padding:32px; text-align:center;
                   box-shadow:0 4px 24px rgba(0,0,0,.08); }
        .tc-icon { font-size:44px; }
        .tc-card h1 { font-size:22px; margin:8px 0 16px; color:#0f172a; }
        .tc-meta { text-align:left; border:1px solid #e2e8f0; border-radius:8px; padding:14px 16px;
                   margin-bottom:20px; display:flex; flex-direction:column; gap:8px; }
        .tc-row { display:flex; justify-content:space-between; gap:12px; font-size:14px; }
        .tc-row .lbl { color:#64748b; }
        .tc-row .val { color:#0f172a; font-weight:500; text-align:right; }
        .tc-hint { font-size:12px; color:#64748b; margin:16px 0 4px; }
        .btn-full { display:flex; }
    </style>
</head>
<body>
<div class="tc-wrap">
    <div class="tc-card">
        <div class="tc-icon" aria-hidden="true">📹</div>
        <h1 th:text="#{teleconsultation.heading}">Téléconsultation</h1>

        <div class="tc-meta">
            <div class="tc-row">
                <span class="lbl" th:text="#{common.patient}">Patient</span>
                <span class="val" th:text="${appointment.patientName ?: '—'}">Patient</span>
            </div>
            <div class="tc-row">
                <span class="lbl" th:text="#{common.doctor}">Médecin</span>
                <span class="val" th:text="${appointment.doctorName ?: '—'}">Médecin</span>
            </div>
            <div class="tc-row">
                <span class="lbl" th:text="#{common.date}">Date</span>
                <span class="val"
                      th:text="${appointment.startTime != null ? #temporals.format(appointment.startTime,'dd/MM/yyyy HH:mm') : '—'}">—</span>
            </div>
            <div class="tc-row" th:if="${appointment.reason != null}">
                <span class="lbl" th:text="#{common.reason}">Motif</span>
                <span class="val" th:text="${appointment.reason}">Motif</span>
            </div>
        </div>

        <a th:if="${appointment.teleconsultationUrl != null}"
           th:href="${appointment.teleconsultationUrl}" target="_blank" rel="noopener"
           class="btn btn-primary btn-lg btn-full" th:text="#{teleconsultation.join}">Rejoindre la salle vidéo</a>

        <div th:if="${appointment.teleconsultationUrl == null}" class="alert alert-error" role="alert"
             th:text="#{teleconsultation.no_link}">
            Aucun lien de téléconsultation n'est associé à ce rendez-vous.
        </div>

        <p class="tc-hint" th:text="#{teleconsultation.hint}">
            Autorisez l'accès à votre caméra et à votre micro lorsque le navigateur le demande.
            Le lien s'ouvre dans un nouvel onglet.
        </p>
        <a href="#" onclick="history.back();return false;" class="btn btn-ghost btn-sm" th:text="'← ' + #{common.back}">← Retour</a>
    </div>
</div>
</body>
</html>
