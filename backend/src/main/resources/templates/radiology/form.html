<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{radiology.form.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<form method="post" th:action="@{/radiology/requests/new}" th:object="${request}">
    <div class="form-card">
        <div class="panel-header"><span th:text="#{radiology.form.heading}">Demande d'imagerie</span></div>

        <div class="form-grid-2">
            <div class="form-group">
                <label class="form-label" for="patientId" th:text="#{radiology.form.patient}">Patient *</label>
                <select th:field="*{patientId}" class="form-control" required>
                    <option value="" th:text="#{radiology.form.choose_patient}">— Choisir un patient —</option>
                    <option th:each="p : ${patients}" th:value="${p.id}"
                            th:text="${p.fullName} + ' (' + ${p.recordNumber} + ')'">Patient</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="doctorId" th:text="#{radiology.form.doctor}">Médecin prescripteur *</label>
                <select th:field="*{doctorId}" class="form-control" required>
                    <option value="" th:text="#{radiology.form.choose_doctor}">— Choisir un médecin —</option>
                    <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName}">Dr.</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="priority" th:text="#{radiology.form.priority}">Priorité</label>
                <select th:field="*{priority}" class="form-control">
                    <option value="NORMAL" th:text="#{priority.NORMAL}">Normal</option>
                    <option value="URGENT" th:text="#{priority.URGENT}">Urgent</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="clinicalInfo" th:text="#{radiology.form.clinical_info}">Renseignements cliniques</label>
                <input type="text" th:field="*{clinicalInfo}" class="form-control" th:placeholder="#{radiology.form.clinical_placeholder}" placeholder="Indication clinique…"/>
            </div>
        </div>

        <input type="hidden" th:field="*{consultationId}"/>

        <div class="form-group">
            <label class="form-label" th:text="#{radiology.form.exams}">Examens demandés *</label>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr><th scope="col" style="width:48px;"><span class="sr-only" th:text="#{common.selection}">Sélection</span></th>
                        <th scope="col" th:text="#{radiology.form.col_code}">Code</th>
                        <th scope="col" th:text="#{radiology.form.col_exam}">Examen</th>
                        <th scope="col" th:text="#{radiology.form.col_type}">Type</th>
                        <th scope="col" th:text="#{radiology.form.col_region}">Région</th>
                        <th scope="col" th:text="#{radiology.form.col_price}">Tarif</th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${exams.isEmpty()}">
                        <td colspan="6" class="empty-state" th:text="#{radiology.form.no_exams}">Aucun examen au catalogue.</td>
                    </tr>
                    <tr th:each="e : ${exams}">
                        <td style="text-align:center;">
                            <input type="checkbox" name="examIds" th:value="${e.id}"
                                   th:aria-label="${e.name}"
                                   th:checked="${request.examIds != null and #lists.contains(request.examIds, e.id)}"/>
                        </td>
                        <td><strong th:text="${e.code}">RX_THORAX</strong></td>
                        <td th:text="${e.name}">Radiographie du thorax</td>
                        <td><span class="badge" th:text="${e.type != null} ? #{${'examtype.' + e.type}} : #{common.none}">RADIOGRAPHIE</span></td>
                        <td th:text="${e.region ?: '—'}">Thorax</td>
                        <td th:text="${#numbers.formatDecimal(e.price,1,'WHITESPACE',0,'POINT')} + ' F'">8 000 F</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div style="display:flex; gap:.5rem; margin-top:12px;">
            <button type="submit" class="btn btn-primary" th:text="#{radiology.form.submit}">Enregistrer la demande</button>
            <a th:href="@{/radiology}" class="btn btn-ghost" th:text="#{common.cancel}">Annuler</a>
        </div>
    </div>
</form>

</th:block></body>
</html>
