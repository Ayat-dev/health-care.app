<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{radiology.list.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${success}" class="alert alert-success" th:text="${success}">OK</div>
<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel">
    <div class="panel-header">
        <span th:text="#{radiology.list.heading}">Demandes d'imagerie</span>
        <a th:href="@{/radiology/requests/new}" class="btn btn-primary btn-sm" th:text="#{radiology.action.new}">+ Nouvelle demande</a>
    </div>

    <form method="get" th:action="@{/radiology/requests}" class="search-bar">
        <input type="date" name="from" th:value="${from}" class="form-control" style="max-width:170px;"/>
        <span>→</span>
        <input type="date" name="to" th:value="${to}" class="form-control" style="max-width:170px;"/>
        <select name="status" class="form-control" style="max-width:170px;">
            <option value="" th:text="#{radiology.list.all_statuses}">— Tous statuts —</option>
            <option value="EN_ATTENTE" th:selected="${status == 'EN_ATTENTE'}" th:text="#{status.EN_ATTENTE}">En attente</option>
            <option value="EN_COURS" th:selected="${status == 'EN_COURS'}" th:text="#{status.EN_COURS}">En cours</option>
            <option value="VALIDE" th:selected="${status == 'VALIDE'}" th:text="#{status.VALIDE}">Validé</option>
            <option value="LIVRE" th:selected="${status == 'LIVRE'}" th:text="#{status.LIVRE}">Livré</option>
            <option value="ANNULE" th:selected="${status == 'ANNULE'}" th:text="#{status.ANNULE}">Annulé</option>
        </select>
        <select name="priority" class="form-control" style="max-width:160px;">
            <option value="" th:text="#{radiology.list.all_priorities}">— Toutes priorités —</option>
            <option value="NORMAL" th:selected="${priority == 'NORMAL'}" th:text="#{priority.NORMAL}">Normal</option>
            <option value="URGENT" th:selected="${priority == 'URGENT'}" th:text="#{priority.URGENT}">Urgent</option>
        </select>
        <button type="submit" class="btn btn-primary btn-sm" th:text="#{common.filter}">Filtrer</button>
    </form>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th th:text="#{radiology.col.number}">N°</th>
                <th th:text="#{radiology.col.priority}">Priorité</th>
                <th th:text="#{radiology.col.patient}">Patient</th>
                <th th:text="#{radiology.col.prescriber}">Prescripteur</th>
                <th th:text="#{radiology.col.requested_at}">Demandé le</th>
                <th th:text="#{common.status}">Statut</th>
                <th th:text="#{common.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${requests.isEmpty()}">
                <td colspan="7" class="empty-state" th:text="#{radiology.list.empty}">Aucune demande.</td>
            </tr>
            <tr th:each="r : ${requests}">
                <td><strong th:text="${r.requestNumber}">RAD-…</strong></td>
                <td>
                    <span th:if="${r.priority == 'URGENT'}" class="badge badge-red" th:text="#{priority.URGENT}">URGENT</span>
                    <span th:unless="${r.priority == 'URGENT'}" class="badge" th:text="#{priority.NORMAL}">Normal</span>
                </td>
                <td th:text="${r.patient != null ? r.patient.fullName : '—'}">Patient</td>
                <td th:text="${r.doctor != null ? r.doctor.fullName : '—'}">Médecin</td>
                <td th:text="${#temporals.format(r.requestedAt,'dd/MM/yyyy HH:mm')}">01/01 09:00</td>
                <td><span class="badge" th:classappend="'badge-' + ${r.status}" th:text="#{${'status.' + r.status}}">EN_ATTENTE</span></td>
                <td style="white-space:nowrap;">
                    <a th:href="@{/radiology/requests/{id}(id=${r.id})}" class="btn btn-ghost btn-sm" th:text="#{common.view}">Voir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
