<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{radiology.report.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${success}" class="alert alert-success" th:text="${success}">OK</div>
<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel" style="margin-bottom:16px;">
    <div class="panel-header">
        <span>
            <strong th:text="${request.requestNumber}">RAD-…</strong> —
            <span th:text="${request.patientName}">Patient</span>
            <span class="badge badge-blue" th:text="${request.patientRecordNumber}">PAT-…</span>
            <span th:if="${request.priority == 'URGENT'}" class="badge badge-red" th:text="#{priority.URGENT}">URGENT</span>
        </span>
    </div>
    <div class="text-muted" style="padding:8px 16px; font-size:13px;">
        <div th:if="${request.clinicalInfo}" th:text="#{radiology.report.clinical_info(${request.clinicalInfo})}">Renseignements</div>
        <div><span th:text="#{radiology.report.exams_label}">Examens :</span>
            <span th:each="it,iter : ${request.items}"
                  th:text="${it.examName} + (${iter.last} ? '' : ', ')">Examen</span>
        </div>
    </div>
</div>

<!-- Compte-rendu -->
<form method="post" th:action="@{/radiology/requests/{id}/report(id=${request.id})}" th:object="${request}">
    <div class="form-card">
        <div class="panel-header"><span th:text="#{radiology.report.heading}">Compte-rendu radiologique</span></div>
        <div class="form-group">
            <label class="form-label" th:text="#{radiology.detail.findings}">Résultats / Description</label>
            <textarea th:field="*{findings}" class="form-control" rows="8"
                      th:placeholder="#{radiology.report.findings_placeholder}"
                      placeholder="Description des images, structures explorées, anomalies…"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label" th:text="#{radiology.detail.conclusion}">Conclusion</label>
            <textarea th:field="*{conclusion}" class="form-control" rows="4"
                      th:placeholder="#{radiology.report.conclusion_placeholder}"
                      placeholder="Synthèse diagnostique…"></textarea>
        </div>
        <div style="display:flex; gap:.5rem; margin-top:8px;">
            <button type="submit" class="btn btn-primary" th:text="#{radiology.report.submit}">Enregistrer le compte-rendu</button>
            <a th:replace="~{fragments/ui :: back(@{/radiology/requests/{id}(id=${request.id})})}"></a>
        </div>
    </div>
</form>

<!-- Images -->
<div class="form-card mt-16">
    <div class="panel-header"><span th:text="#{radiology.detail.images(${request.imageCount})}">Images</span></div>

    <form method="post" th:action="@{/radiology/requests/{id}/images(id=${request.id})}"
          enctype="multipart/form-data" style="display:flex; gap:.5rem; align-items:flex-end; flex-wrap:wrap;">
        <div class="form-group" style="margin:0;">
            <label class="form-label" th:text="#{radiology.report.add_image}">Ajouter une image (JPEG, PNG, WebP)</label>
            <input type="file" name="file" accept="image/jpeg,image/png,image/webp" class="form-control" required/>
        </div>
        <div class="form-group" style="margin:0; flex:1; min-width:180px;">
            <label class="form-label" th:text="#{radiology.report.caption}">Légende (optionnel)</label>
            <input type="text" name="caption" class="form-control" th:placeholder="#{radiology.report.caption_placeholder}" placeholder="ex. Cliché de face"/>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{radiology.report.upload}">Téléverser</button>
    </form>

    <div th:if="${request.images.isEmpty()}" class="empty-state" style="margin-top:12px;" th:text="#{radiology.detail.no_images}">Aucune image attachée.</div>
    <div th:unless="${request.images.isEmpty()}" class="radio-gallery" style="margin-top:12px;">
        <figure th:each="img : ${request.images}" class="radio-thumb">
            <a th:href="${img.url}" target="_blank"><img th:src="${img.url}" th:alt="#{radiology.detail.image_alt}" alt="Image"/></a>
            <figcaption th:text="${img.caption ?: ''}"></figcaption>
            <form method="post" th:action="@{/radiology/requests/{id}/images/{imgId}/delete(id=${request.id},imgId=${img.id})}"
                  th:onsubmit="'return confirm(\'' + #{radiology.report.delete_image_confirm} + '\');'">
                <button class="btn btn-ghost btn-sm" th:text="#{common.delete}">Supprimer</button>
            </form>
        </figure>
    </div>
</div>

</th:block></body>
</html>
