<html th:replace="~{layouts/base :: layout(#{error.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div class="empty-state" style="padding: 64px 0;">
    <div style="font-size: 64px; margin-bottom: 16px;" th:switch="${status}">
        <span th:case="403">🔒</span>
        <span th:case="404">🔍</span>
        <span th:case="*">⚠️</span>
    </div>
    <div style="font-size: 48px; font-weight: 700; color: #0f172a; margin-bottom: 8px;"
         th:text="${status}">Erreur</div>
    <h2 style="color: #374151; margin-bottom: 12px;" th:text="${title}">Erreur</h2>
    <p style="color: #64748b; max-width: 400px; margin: 0 auto 24px;" th:text="${message}">
        Une erreur s'est produite.
    </p>
    <a th:href="@{__${homeUrl ?: '/'}__}" class="btn btn-primary" th:text="#{error.home}">Retour à l'accueil</a>
</div>

</th:block></body>
</html>
