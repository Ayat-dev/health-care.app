<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{admin.users.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel">
    <div class="panel-header">
        <span th:text="#{admin.users.panel}">Comptes utilisateurs</span>
        <a th:href="@{/admin/users/new}" class="btn btn-primary btn-sm" th:text="#{admin.users.new}">+ Nouvel utilisateur</a>
    </div>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th th:text="#{admin.users.col_username}">Identifiant</th>
                <th th:text="#{admin.users.col_fullname}">Nom complet</th>
                <th th:text="#{admin.users.col_role}">Rôle</th>
                <th th:text="#{common.status}">Statut</th>
                <th th:text="#{common.created_at}">Créé le</th>
                <th th:text="#{common.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${users.isEmpty()}">
                <td colspan="6" class="empty-state" th:text="#{admin.users.empty}">Aucun utilisateur.</td>
            </tr>
            <tr th:each="u : ${users}">
                <td><code th:text="${u.username}">admin</code></td>
                <td th:text="${u.fullName != null ? u.fullName : '—'}">Nom</td>
                <td><span class="badge badge-blue" th:text="#{${'role.' + u.role}}">ROLE</span></td>
                <td>
                    <span th:if="${u.active}" class="badge badge-green" th:text="#{common.active}">Actif</span>
                    <span th:unless="${u.active}" class="badge badge-red" th:text="#{common.inactive}">Désactivé</span>
                </td>
                <td th:text="${u.createdAt != null ? #temporals.format(u.createdAt,'dd/MM/yyyy') : '—'}">—</td>
                <td>
                    <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-ghost btn-sm" th:text="#{common.edit}">Modifier</a>
                    <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-ghost btn-sm"
                                th:text="${u.active} ? #{common.deactivate} : #{common.activate}">Désactiver</button>
                    </form>
                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" style="display:inline"
                          th:onsubmit="'return confirm(\'' + #{admin.users.delete_confirm} + '\');'">
                        <button type="submit" class="btn btn-ghost btn-sm" th:text="#{common.delete}">Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
