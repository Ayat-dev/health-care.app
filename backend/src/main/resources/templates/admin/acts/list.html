<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{admin.acts.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel">
    <div class="panel-header">
        <span th:text="#{admin.acts.panel}">Catalogue des actes</span>
        <a th:href="@{/admin/acts/new}" class="btn btn-primary btn-sm" th:text="#{admin.acts.new}">+ Nouvel acte</a>
    </div>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{common.code}">Code</th>
                <th scope="col" th:text="#{common.name}">Nom</th>
                <th scope="col" th:text="#{common.department}">Département</th>
                <th scope="col" class="text-right" th:text="#{common.price}">Tarif</th>
                <th scope="col" th:text="#{common.status}">Statut</th>
                <th scope="col" th:text="#{common.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${acts.isEmpty()}">
                <td colspan="6" class="empty-state" th:text="#{admin.acts.empty}">Aucun acte.</td>
            </tr>
            <tr th:each="a : ${acts}">
                <td><code th:text="${a.code}">CONS_GEN</code></td>
                <td th:text="${a.name}">Consultation</td>
                <td th:text="${a.departmentName != null ? a.departmentName : '—'}">—</td>
                <td class="text-right" th:text="${#numbers.formatDecimal(a.price, 1, 'WHITESPACE', 0, 'POINT')} + ' F'">5 000 F</td>
                <td>
                    <span th:if="${a.active}" class="badge badge-green" th:text="#{common.active}">Actif</span>
                    <span th:unless="${a.active}" class="badge badge-red" th:text="#{common.inactive}">Désactivé</span>
                </td>
                <td>
                    <a th:href="@{/admin/acts/{id}/edit(id=${a.id})}" class="btn btn-ghost btn-sm" th:text="#{common.edit}">Modifier</a>
                    <form th:action="@{/admin/acts/{id}/toggle(id=${a.id})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-ghost btn-sm"
                                th:text="${a.active} ? #{common.deactivate} : #{common.activate}">Désactiver</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
