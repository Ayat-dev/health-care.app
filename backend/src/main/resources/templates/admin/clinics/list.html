<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{admin.clinics.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>
<div th:if="${success}" class="alert alert-info" th:text="#{${success}}">OK</div>

<div class="panel">
    <div class="panel-header">
        <span th:text="#{admin.clinics.panel}">Cliniques (tenants)</span>
        <a th:href="@{/admin/clinics/new}" class="btn btn-primary btn-sm" th:text="#{admin.clinics.new}">+ Nouvelle clinique</a>
    </div>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{common.code}">Code</th>
                <th scope="col" th:text="#{common.name}">Nom</th>
                <th scope="col" th:text="#{common.phone}">Téléphone</th>
                <th scope="col" th:text="#{common.email}">Email</th>
                <th scope="col" th:text="#{common.status}">Statut</th>
                <th scope="col" th:text="#{admin.clinics.col_created}">Créée le</th>
                <th scope="col" th:text="#{common.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${clinics.isEmpty()}">
                <td colspan="7" class="empty-state" th:text="#{admin.clinics.empty}">Aucune clinique.</td>
            </tr>
            <tr th:each="c : ${clinics}">
                <td><code th:text="${c.code}">CODE</code></td>
                <td th:text="${c.name}">Nom</td>
                <td th:text="${c.phone != null ? c.phone : '—'}">—</td>
                <td th:text="${c.email != null ? c.email : '—'}">—</td>
                <td>
                    <span th:if="${c.active}" class="badge badge-green" th:text="#{admin.clinics.badge_active}">Active</span>
                    <span th:unless="${c.active}" class="badge badge-red" th:text="#{admin.clinics.badge_inactive}">Désactivée</span>
                </td>
                <td th:text="${c.createdAt != null ? #temporals.format(c.createdAt,'dd/MM/yyyy') : '—'}">—</td>
                <td>
                    <a th:href="@{/admin/clinics/{id}/edit(id=${c.id})}" class="btn btn-ghost btn-sm" th:text="#{common.edit}">Modifier</a>
                    <a th:href="@{/admin/clinics/{id}/admin(id=${c.id})}" class="btn btn-ghost btn-sm" th:text="#{admin.clinics.create_admin}">+ Admin</a>
                    <form th:action="@{/admin/clinics/{id}/toggle(id=${c.id})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-ghost btn-sm"
                                th:text="${c.active} ? #{common.deactivate} : #{common.activate}">Désactiver</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
