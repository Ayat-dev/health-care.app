<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(#{admin.departments.title}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="panel">
    <div class="panel-header">
        <span th:text="#{admin.departments.panel}">Départements &amp; services</span>
        <a th:href="@{/admin/departments/new}" class="btn btn-primary btn-sm" th:text="#{admin.departments.new}">+ Nouveau département</a>
    </div>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{common.code}">Code</th>
                <th scope="col" th:text="#{common.name}">Nom</th>
                <th scope="col" th:text="#{admin.departments.col_color}">Couleur</th>
                <th scope="col" th:text="#{common.status}">Statut</th>
                <th scope="col" th:text="#{common.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${departments.isEmpty()}">
                <td colspan="5" class="empty-state" th:text="#{admin.departments.empty}">Aucun département.</td>
            </tr>
            <tr th:each="d : ${departments}">
                <td><code th:text="${d.code}">MED_GEN</code></td>
                <td th:text="${d.name}">Médecine générale</td>
                <td>
                    <span th:if="${d.color != null and d.color != ''}"
                          th:style="'display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:middle;background:' + ${d.color}"></span>
                    <span th:text="${d.color != null ? d.color : '—'}" style="vertical-align:middle;margin-left:6px">—</span>
                </td>
                <td>
                    <span th:if="${d.active}" class="badge badge-green" th:text="#{common.active}">Actif</span>
                    <span th:unless="${d.active}" class="badge badge-red" th:text="#{common.inactive}">Désactivé</span>
                </td>
                <td>
                    <a th:href="@{/admin/departments/{id}/edit(id=${d.id})}" class="btn btn-ghost btn-sm" th:text="#{common.edit}">Modifier</a>
                    <form th:action="@{/admin/departments/{id}/toggle(id=${d.id})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-ghost btn-sm"
                                th:text="${d.active} ? #{common.deactivate} : #{common.activate}">Désactiver</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
