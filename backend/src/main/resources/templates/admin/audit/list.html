<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout('Journal d’audit', ~{::content})}">
<body><th:block th:fragment="content">

<div class="panel">
    <div class="panel-header">
        <span>Journal d’audit</span>
        <span class="badge badge-blue" th:text="${'≤ ' + maxRows + ' entrées'}">≤ 300 entrées</span>
    </div>

    <!-- Filtres -->
    <form th:action="@{/admin/audit}" method="get" class="form-grid-2" style="padding:1rem; gap:.75rem; align-items:end;">
        <div class="form-group">
            <label class="form-label">Utilisateur</label>
            <input type="text" name="username" class="form-control" th:value="${username}" placeholder="nom d’utilisateur"/>
        </div>
        <div class="form-group">
            <label class="form-label">Type d’entité</label>
            <select name="entityType" class="form-control">
                <option value="">— Tous —</option>
                <option th:each="t : ${entityTypes}" th:value="${t}" th:text="${t}"
                        th:selected="${t == entityType}">Patient</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Action</label>
            <select name="action" class="form-control">
                <option value="">— Toutes —</option>
                <option th:each="a : ${actions}" th:value="${a}" th:text="${a}"
                        th:selected="${a == action}">CREATE</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Du</label>
            <input type="date" name="from" class="form-control" th:value="${from}"/>
        </div>
        <div class="form-group">
            <label class="form-label">Au</label>
            <input type="date" name="to" class="form-control" th:value="${to}"/>
        </div>
        <div class="form-group" style="display:flex; gap:.5rem;">
            <button type="submit" class="btn btn-primary btn-sm">Filtrer</button>
            <a th:href="@{/admin/audit}" class="btn btn-ghost btn-sm">Réinitialiser</a>
        </div>
    </form>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th>Date</th>
                <th>Utilisateur</th>
                <th>Action</th>
                <th>Entité</th>
                <th>ID</th>
                <th>IP</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${entries.isEmpty()}">
                <td colspan="6" class="empty-state">Aucune entrée d’audit pour ces critères.</td>
            </tr>
            <tr th:each="e : ${entries}">
                <td th:text="${#temporals.format(e.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-06-19 10:30:00</td>
                <td th:text="${e.username}">admin</td>
                <td><span class="badge badge-blue" th:text="${e.action}">CREATE</span></td>
                <td th:text="${e.entityType}">Patient</td>
                <td th:text="${e.entityId != null ? e.entityId : '—'}">42</td>
                <td><code th:text="${e.ipAddress != null ? e.ipAddress : '—'}">127.0.0.1</code></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body>
</html>
