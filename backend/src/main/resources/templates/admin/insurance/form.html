<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(${provider.id == null} ? #{admin.insurance.form_title_new} : #{admin.insurance.form_title_edit}, ~{::content})}">
<body><th:block th:fragment="content">

<div th:if="${error}" class="alert alert-error" th:text="${error}">Erreur</div>

<div class="form-card">
    <form th:action="${provider.id == null ? '/admin/insurance/new' : '/admin/insurance/' + provider.id + '/edit'}"
          method="post">

        <div class="form-grid-2">
            <div class="form-group">
                <label class="form-label" th:text="#{common.name_required}">Nom *</label>
                <input type="text" name="name" th:value="${provider.name}"
                       class="form-control" placeholder="IPM" required/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{common.code}">Code</label>
                <input type="text" name="code" th:value="${provider.code}"
                       class="form-control" placeholder="IPM"/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{common.type}">Type</label>
                <select name="type" class="form-control">
                    <option value="" th:selected="${provider.type == null}">—</option>
                    <option value="PUBLIQUE" th:selected="${provider.type == 'PUBLIQUE'}" th:text="#{instype.PUBLIQUE}">Publique</option>
                    <option value="PRIVEE" th:selected="${provider.type == 'PRIVEE'}" th:text="#{instype.PRIVEE}">Privée</option>
                    <option value="MUTUELLE" th:selected="${provider.type == 'MUTUELLE'}" th:text="#{instype.MUTUELLE}">Mutuelle</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{admin.insurance.coverage}">Prise en charge (%)</label>
                <input type="number" name="coveragePercent" th:value="${provider.coveragePercent}"
                       class="form-control" min="0" max="100" step="0.01" placeholder="80"/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{common.contact}">Contact</label>
                <input type="text" name="contact" th:value="${provider.contact}" class="form-control"/>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{common.status}">Statut</label>
                <select name="active" class="form-control">
                    <option value="true" th:selected="${provider.active}" th:text="#{common.active}">Actif</option>
                    <option value="false" th:selected="${!provider.active}" th:text="#{common.inactive}">Désactivé</option>
                </select>
            </div>
        </div>

        <div class="form-actions">
            <a th:href="@{/admin/insurance}" class="btn btn-ghost" th:text="#{common.cancel}">Annuler</a>
            <button type="submit" class="btn btn-primary">
                <span th:text="${provider.id == null} ? #{admin.insurance.create} : #{common.save}">Créer</span>
            </button>
        </div>
    </form>
</div>

</th:block></body>
</html>
