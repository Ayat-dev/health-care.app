<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — ClinicApp'">ClinicApp</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">⚕</span>
            <span class="brand-name">ClinicApp</span>
        </div>
        <nav class="sidebar-nav">

            <!-- ── PRINCIPAL ─────────────────────────────────────── -->
            <th:block th:if="${!principalModules.isEmpty()}">
                <div class="nav-section">PRINCIPAL</div>
                <th:block th:each="mod : ${principalModules}">

                    <!-- Notifications : traitement spécial pour le badge -->
                    <th:block th:if="${mod.name() == 'NOTIFICATIONS'}">
                        <a th:href="${mod.urlPrefix}" class="nav-item"
                           th:classappend="${#strings.startsWith(currentUri, mod.urlPrefix)} ? 'active'">
                            <span th:text="${mod.icon}">🔔</span>
                            <span th:text="${mod.label}">Notifications</span>
                            <span th:if="${unreadNotifications > 0}"
                                  class="badge badge-red"
                                  style="margin-left:auto; font-size:.7rem; padding:.1rem .4rem;"
                                  th:text="${unreadNotifications}">0</span>
                        </a>
                    </th:block>

                    <!-- Tous les autres modules PRINCIPAL -->
                    <th:block th:unless="${mod.name() == 'NOTIFICATIONS'}">
                        <a th:href="${mod.urlPrefix}" class="nav-item"
                           th:classappend="${#strings.startsWith(currentUri, mod.urlPrefix)} ? 'active'">
                            <span th:text="${mod.icon}"></span>
                            <span th:text="${mod.label}"></span>
                        </a>
                    </th:block>

                </th:block>
            </th:block>

            <!-- ── SOINS ──────────────────────────────────────────── -->
            <th:block th:if="${!soinsModules.isEmpty()}">
                <div class="nav-section">SOINS</div>
                <th:block th:each="mod : ${soinsModules}">
                    <a th:href="${mod.urlPrefix}" class="nav-item"
                       th:classappend="${#strings.startsWith(currentUri, mod.urlPrefix)} ? 'active'">
                        <span th:text="${mod.icon}"></span>
                        <span th:text="${mod.label}"></span>
                    </a>
                </th:block>
            </th:block>

            <!-- ── GESTION ────────────────────────────────────────── -->
            <th:block th:if="${!gestionModules.isEmpty()}">
                <div class="nav-section">GESTION</div>
                <th:block th:each="mod : ${gestionModules}">
                    <a th:href="${mod.urlPrefix}" class="nav-item"
                       th:classappend="${#strings.startsWith(currentUri, mod.urlPrefix)} ? 'active'">
                        <span th:text="${mod.icon}"></span>
                        <span th:text="${mod.label}"></span>
                    </a>
                </th:block>
            </th:block>

            <!-- ── ADMIN ──────────────────────────────────────────── -->
            <th:block th:if="${!adminModules.isEmpty()}">
                <div class="nav-section">ADMIN</div>
                <th:block th:each="mod : ${adminModules}">
                    <a th:href="${mod.urlPrefix}" class="nav-item"
                       th:classappend="${#strings.startsWith(currentUri, mod.urlPrefix)} ? 'active'">
                        <span th:text="${mod.icon}"></span>
                        <span th:text="${mod.label}"></span>
                    </a>
                </th:block>
            </th:block>

        </nav>
        <div class="sidebar-footer">
            <span sec:authentication="name">Utilisateur</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-ghost btn-sm">Déconnexion</button>
            </form>
        </div>
    </aside>

    <!-- Contenu principal -->
    <main class="main">
        <div class="topbar">
            <h1 class="topbar-title" th:text="${title}">Page</h1>
            <div class="topbar-actions">
                <span class="badge badge-blue" sec:authentication="name">User</span>
            </div>
        </div>
        <div class="page-content">
            <th:block th:replace="${content}"/>
        </div>
    </main>
</div>
</body>
</html>
