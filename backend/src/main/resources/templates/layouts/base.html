<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- CSRF (jeton envoyé au CONNECT STOMP par worklist-live.js, P5.1 Lot D) -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
    <title th:text="${title} + ' — ClinicApp'">ClinicApp</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <!-- PWA (P3.1) -->
    <link rel="manifest" th:href="@{/manifest.webmanifest}"/>
    <meta name="theme-color" content="#0f172a"/>
    <link rel="apple-touch-icon" th:href="@{/images/icon.svg}"/>
    <script th:src="@{/js/pwa.js}" defer></script>
</head>
<body>
<!-- Sprite d'icônes SVG (nav) — inclus une fois, référencé par <use href="#ic-…"> -->
<svg th:replace="~{fragments/icons :: sprite}"></svg>
<!-- Évitement de bloc (WCAG 2.4.1) — 1er élément focusable -->
<a class="skip-link" href="#main-content" th:text="#{a11y.skip_to_content}">Aller au contenu principal</a>
<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon" aria-hidden="true">⚕</span>
            <span class="brand-name">ClinicApp</span>
        </div>
        <nav class="sidebar-nav" th:aria-label="#{a11y.main_nav}">

            <!-- ── PRINCIPAL ─────────────────────────────────────── -->
            <th:block th:if="${!principalModules.isEmpty()}">
                <div class="nav-section" th:text="#{nav.section.principal}">PRINCIPAL</div>
                <th:block th:each="navMod : ${principalModules}">

                    <!-- Notifications : traitement spécial pour le badge -->
                    <th:block th:if="${navMod.name() == 'NOTIFICATIONS'}">
                        <a th:href="${navMod.urlPrefix}" class="nav-item"
                           th:classappend="${#strings.startsWith(currentUri, navMod.urlPrefix)} ? 'active'"
                           th:aria-current="${#strings.startsWith(currentUri, navMod.urlPrefix)} ? 'page' : null">
                            <svg class="nav-icon" aria-hidden="true"><use th:attr="href='#ic-' + ${navMod.icon}"></use></svg>
                            <span th:text="#{${navMod.labelKey}}">Notifications</span>
                            <span th:if="${unreadNotifications > 0}"
                                  class="badge badge-red"
                                  style="margin-inline-start:auto; font-size:.7rem; padding:.1rem .4rem;"
                                  th:text="${unreadNotifications}">0</span>
                        </a>
                    </th:block>

                    <!-- Tous les autres modules PRINCIPAL -->
                    <th:block th:unless="${navMod.name() == 'NOTIFICATIONS'}">
                        <a th:href="${navMod.urlPrefix}" class="nav-item"
                           th:classappend="${#strings.startsWith(currentUri, navMod.urlPrefix)} ? 'active'"
                           th:aria-current="${#strings.startsWith(currentUri, navMod.urlPrefix)} ? 'page' : null">
                            <svg class="nav-icon" aria-hidden="true"><use th:attr="href='#ic-' + ${navMod.icon}"></use></svg>
                            <span th:text="#{${navMod.labelKey}}"></span>
                        </a>
                    </th:block>

                </th:block>
            </th:block>

            <!-- ── SOINS ──────────────────────────────────────────── -->
            <th:block th:if="${!soinsModules.isEmpty()}">
                <div class="nav-section" th:text="#{nav.section.soins}">SOINS</div>
                <th:block th:each="navMod : ${soinsModules}">
                    <a th:href="${navMod.urlPrefix}" class="nav-item"
                       th:classappend="${#strings.startsWith(currentUri, navMod.urlPrefix)} ? 'active'"
                       th:aria-current="${#strings.startsWith(currentUri, navMod.urlPrefix)} ? 'page' : null">
                        <svg class="nav-icon" aria-hidden="true"><use th:attr="href='#ic-' + ${navMod.icon}"></use></svg>
                        <span th:text="#{${navMod.labelKey}}"></span>
                    </a>
                </th:block>
            </th:block>

            <!-- ── GESTION ────────────────────────────────────────── -->
            <th:block th:if="${!gestionModules.isEmpty()}">
                <div class="nav-section" th:text="#{nav.section.gestion}">GESTION</div>
                <th:block th:each="navMod : ${gestionModules}">
                    <a th:href="${navMod.urlPrefix}" class="nav-item"
                       th:classappend="${#strings.startsWith(currentUri, navMod.urlPrefix)} ? 'active'"
                       th:aria-current="${#strings.startsWith(currentUri, navMod.urlPrefix)} ? 'page' : null">
                        <svg class="nav-icon" aria-hidden="true"><use th:attr="href='#ic-' + ${navMod.icon}"></use></svg>
                        <span th:text="#{${navMod.labelKey}}"></span>
                    </a>
                </th:block>
            </th:block>

            <!-- ── ADMIN ──────────────────────────────────────────── -->
            <th:block th:if="${!adminModules.isEmpty()}">
                <div class="nav-section" th:text="#{nav.section.admin}">ADMIN</div>
                <th:block th:each="navMod : ${adminModules}">
                    <a th:href="${navMod.urlPrefix}" class="nav-item"
                       th:classappend="${#strings.startsWith(currentUri, navMod.urlPrefix)} ? 'active'"
                       th:aria-current="${#strings.startsWith(currentUri, navMod.urlPrefix)} ? 'page' : null">
                        <svg class="nav-icon" aria-hidden="true"><use th:attr="href='#ic-' + ${navMod.icon}"></use></svg>
                        <span th:text="#{${navMod.labelKey}}"></span>
                    </a>
                </th:block>
            </th:block>

        </nav>
        <div class="sidebar-footer">
            <span sec:authentication="name" th:title="#{layout.user}">Utilisateur</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-ghost btn-sm" th:text="#{layout.logout}">Déconnexion</button>
            </form>
        </div>
    </aside>
    <!-- Voile (mobile) : assombrit le contenu quand le tiroir sidebar est ouvert -->
    <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

    <!-- Contenu principal -->
    <main class="main" id="main-content" tabindex="-1">
        <div class="topbar">
            <!-- Bouton tiroir (visible uniquement sur petit écran) -->
            <button type="button" class="topbar-burger" id="sidebar-toggle"
                    aria-controls="sidebar" aria-expanded="false" th:aria-label="#{a11y.toggle_menu}">
                <svg class="nav-icon" aria-hidden="true"><use href="#ic-menu"></use></svg>
            </button>
            <h1 class="topbar-title" th:text="${title}">Page</h1>
            <div class="topbar-actions">
                <!-- Invite d'installation PWA (B2) — masquée par défaut ; js/pwa.js l'affiche
                     uniquement quand le navigateur émet beforeinstallprompt (app non installée). -->
                <button type="button" class="btn btn-ghost btn-sm" id="pwa-install-btn" hidden
                        th:title="#{pwa.install_title}" th:data-installed="#{pwa.installed}">
                    <span aria-hidden="true">⬇</span>
                    <span th:text="#{pwa.install}">Installer l'app</span>
                </button>
                <!-- Recherche globale (P3.5) — ouvre la palette (clic ou Ctrl/⌘+K) -->
                <button type="button" class="topbar-search" id="global-search-trigger"
                        th:aria-label="#{search.aria_label}" aria-haspopup="dialog">
                    <span aria-hidden="true">🔍</span>
                    <span class="topbar-search-text" th:text="#{search.open}">Rechercher</span>
                    <kbd class="topbar-search-kbd" aria-hidden="true">Ctrl K</kbd>
                </button>
                <!-- Sélecteur de langue (P3.2) — menu déroulant ; bascule ?lang=, conserve la page -->
                <details class="lang-dropdown">
                    <summary class="lang-current" th:title="#{lang.label}">
                        <svg class="nav-icon" aria-hidden="true"><use href="#ic-globe"></use></svg>
                        <span th:text="#{${'lang.' + #locale.language}}">FR</span>
                    </summary>
                    <nav class="lang-menu" th:aria-label="#{lang.label}">
                        <a th:href="@{${currentUri}(lang='fr')}" th:text="#{lang.fr}"
                           th:classappend="${#locale.language == 'fr'} ? 'active'"
                           th:aria-current="${#locale.language == 'fr'} ? 'true' : null">Français</a>
                        <a th:href="@{${currentUri}(lang='en')}" th:text="#{lang.en}"
                           th:classappend="${#locale.language == 'en'} ? 'active'"
                           th:aria-current="${#locale.language == 'en'} ? 'true' : null">English</a>
                        <a th:href="@{${currentUri}(lang='ar')}" th:text="#{lang.ar}"
                           th:classappend="${#locale.language == 'ar'} ? 'active'"
                           th:aria-current="${#locale.language == 'ar'} ? 'true' : null">العربية</a>
                    </nav>
                </details>
                <span class="badge badge-blue" sec:authentication="name">User</span>
            </div>
        </div>
        <div class="page-content">
            <!-- Statut de la file de synchro hors-ligne (B4) — masqué par défaut ; js/offline-sync.js
                 l'affiche quand des RDV créés hors-ligne sont en attente / en échec de rejeu. -->
            <div id="offline-queue-status" class="offline-banner" role="status" aria-live="polite" hidden
                 th:data-sync-url="@{/appointments/offline}"
                 th:data-msg-pending="#{offline.pending}"
                 th:data-msg-failed="#{offline.failed}"
                 th:data-msg-queued="#{offline.queued}"></div>
            <!-- Fil d'Ariane (P6 WS5) — auto-dérivé : Accueil / Module / Page courante.
                 Masqué sur la page d'accueil du rôle (on y est déjà). -->
            <nav class="breadcrumb" th:if="${currentUri != homeUrl}" th:aria-label="#{a11y.breadcrumb}">
                <a th:href="@{${homeUrl}}" th:text="#{nav.home}">Accueil</a>
                <th:block th:if="${currentModule != null}">
                    <span class="breadcrumb-sep" aria-hidden="true">/</span>
                    <a th:if="${currentUri != currentModule.urlPrefix}"
                       th:href="@{${currentModule.urlPrefix}}" th:text="#{${currentModule.labelKey}}">Module</a>
                    <span th:if="${currentUri == currentModule.urlPrefix}"
                          class="breadcrumb-current" aria-current="page" th:text="#{${currentModule.labelKey}}">Module</span>
                </th:block>
                <th:block th:if="${currentModule == null or currentUri != currentModule.urlPrefix}">
                    <span class="breadcrumb-sep" aria-hidden="true">/</span>
                    <span class="breadcrumb-current" aria-current="page" th:text="${title}">Page</span>
                </th:block>
            </nav>
            <!-- Sous-navigation du module (P6 WS5) — onglets persistants, actif auto-calculé.
                 Source : config/ModuleTabs (registre central). Rien si le module n'en déclare pas. -->
            <nav class="module-tabs" th:if="${!moduleTabs.isEmpty()}" th:aria-label="#{a11y.module_nav}">
                <a th:each="t : ${moduleTabs}" th:href="@{${t.url}}" class="module-tab"
                   th:classappend="${t.url == activeTabUrl} ? 'active'"
                   th:aria-current="${t.url == activeTabUrl} ? 'page' : null"
                   th:text="#{${t.labelKey}}">Onglet</a>
            </nav>
            <th:block th:replace="${content}"/>
        </div>
    </main>
</div>

<!-- Palette de recherche globale (P3.5) — pilotée par js/search.js -->
<div class="cmdk-overlay" id="cmdk-overlay" hidden
     th:data-suggest-url="@{/search/suggest}"
     th:data-search-url="@{/search}">
    <div class="cmdk-panel" role="dialog" aria-modal="true" th:aria-label="#{search.aria_label}">
        <div class="cmdk-input-row">
            <span class="cmdk-input-icon" aria-hidden="true">🔍</span>
            <input type="text" class="cmdk-input" id="cmdk-input" autocomplete="off" spellcheck="false"
                   role="combobox" aria-expanded="false" aria-controls="cmdk-results" aria-autocomplete="list"
                   th:placeholder="#{search.placeholder}"/>
        </div>
        <ul class="cmdk-results" id="cmdk-results" role="listbox" th:aria-label="#{search.aria_label}"
            th:data-prompt="#{search.prompt}" th:data-empty="#{search.no_results}"></ul>
        <div class="cmdk-footer" th:text="#{search.hint_nav}">↑↓ · Entrée · Échap</div>
    </div>
</div>
<script th:src="@{/js/search.js}" defer></script>
<!-- Worklists temps réel (P5.1 Lot D) — actif uniquement si la page déclare [data-worklist-topic] -->
<script th:src="@{/js/worklist-live.js}" defer></script>
<!-- Helpers UI partagés (onglets deep-linkables + ARIA) — no-op si la page n'a pas de .tab[data-tab] -->
<script th:src="@{/js/ui.js}" defer></script>
<!-- File de synchro des écritures hors-ligne (B4, PWA) — no-op sans IndexedDB/WebCrypto -->
<script th:src="@{/js/offline-sync.js}" defer></script>
</body>
</html>
