# ============================================================
#  Profil PROD — PostgreSQL, secrets injectés par l'environnement
#  AUCUNE valeur par défaut pour les secrets : si une variable
#  manque, l'application REFUSE de démarrer (fail-fast). C'est voulu.
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Console H2 désactivée en production
spring.h2.console.enabled=false

# Secret JWT obligatoire — pas de défaut → fail-fast si absent
app.jwt.secret=${JWT_SECRET}

# Clé de chiffrement PHI au repos (P2.5) — obligatoire, pas de défaut → fail-fast
app.encryption.key=${APP_ENCRYPTION_KEY}

# Secret HMAC des webhooks Mobile Money (P3.3) — obligatoire, pas de défaut → fail-fast
app.webhook.secret=${MOBILE_MONEY_WEBHOOK_SECRET}

# Mot de passe du compte de scraping monitoring (P4.3) — obligatoire, pas de défaut → fail-fast
app.monitoring.password=${MONITORING_PASSWORD}

# Logs SQL muets en prod
spring.jpa.show-sql=false

# ── Derrière le reverse-proxy TLS (nginx) — P2.5 transit ────────────────────
# Respecte les en-têtes X-Forwarded-* (schéma https, host) pour des redirections
# et cookies corrects.
server.forward-headers-strategy=framework
# Cookie de session uniquement sur HTTPS + inaccessible au JS.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
