# ============================================================
#  Profil PROD — PostgreSQL, secrets injectés par l'environnement
#  AUCUNE valeur par défaut pour les secrets : si une variable
#  manque, l'application REFUSE de démarrer (fail-fast). C'est voulu.
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Console H2 désactivée en production
spring.h2.console.enabled=false

# Secret JWT obligatoire — pas de défaut → fail-fast si absent
app.jwt.secret=${JWT_SECRET}

# Logs SQL muets en prod
spring.jpa.show-sql=false
