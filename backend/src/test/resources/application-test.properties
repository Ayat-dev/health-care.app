# ============================================================
#  Profil TEST — H2 en mémoire + Flyway, données seedées par
#  DataInitializer (@Profile("!prod")). Secret JWT fixe de test.
#  Activé par @ActiveProfiles("test") sur les classes de test.
# ============================================================

spring.datasource.url=jdbc:h2:mem:clinicdb-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false

# Secret de TEST uniquement (>= 32 chars pour HS256)
app.jwt.secret=clinicapp-test-secret-key-not-for-production-min32chars!!

# D1a — cookie de refresh non-Secure en test (MockMvc/HTTP)
app.jwt.refresh-cookie-secure=false

# D1d — limite de login très haute en test (la suite enchaîne de nombreux logins depuis
# 127.0.0.1 dans le contexte partagé). Le test dédié LoginRateLimitTest la rabaisse via
# @TestPropertySource (contexte séparé).
app.security.login-rate-limit.max-attempts=1000000

# Clé de chiffrement PHI au repos (P2.5) — TEST uniquement
app.encryption.key=clinicapp-test-encryption-key-not-for-production!!

# Secret HMAC des webhooks Mobile Money (P3.3) — TEST uniquement
app.webhook.secret=clinicapp-test-webhook-secret-not-for-production

# Mot de passe du compte de scraping monitoring (P4.3) — TEST uniquement
app.monitoring.password=clinicapp-test-monitoring-secret
