services:
  postgres:
    image: postgres:16
    container_name: medical_postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - medical_net

  backend:
    build: ./backend
    container_name: medical_backend
    restart: always
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    # Pas de port publié sur l'hôte : le backend n'est joignable QUE via le
    # reverse-proxy nginx (chiffrement en transit forcé). Sur le réseau Docker
    # privé, nginx l'atteint en clair sur backend:8080.
    expose:
      - "8080"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medical_net

  # ── Reverse-proxy TLS (P2.5 — chiffrement en transit) ──────────────────────
  # Termine le HTTPS et relaie vers le backend. Génerer le certificat AVANT le
  # 1er démarrage (cf. nginx/README.md) — sinon nginx refuse de démarrer.
  nginx:
    image: nginx:1.27-alpine
    container_name: medical_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - medical_net

  # ── Monitoring (P4.3 — Prometheus + Grafana) ───────────────────────────────
  # Démarrage opt-in via le profil compose « monitoring » :
  #     docker compose --profile monitoring up -d
  # (sinon ces services restent à l'arrêt). Prometheus scrape /actuator/prometheus
  # du backend sur le réseau privé ; Grafana visualise. UptimeRobot, lui, pinge
  # /actuator/health (public) via le reverse-proxy nginx, sans ces conteneurs.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: medical_prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    # Pas de port publié : interrogé uniquement par Grafana sur le réseau privé.
    expose:
      - "9090"
    depends_on:
      - backend
    networks:
      - medical_net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: medical_grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # D2a — datasource Prometheus + dashboards métier auto-provisionnés au boot.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - medical_net

# ── Client desktop JavaFX — GELÉ (cf. desktop/FROZEN.md) ──────────────────────
# Le développement du client lourd est mis en pause : toute l'activité passe par
# l'app web. Le code reste dans desktop/ comme socle à reprendre plus tard, mais
# il n'est plus construit ni démarré ici (un service JavaFX/X11 n'a de toute façon
# pas sa place côté serveur). Le contrat de reprise = l'API /api/** (JWT stateless).

networks:
  medical_net:

volumes:
  postgres_data:
  backend_uploads:
  prometheus_data:
  grafana_data:
