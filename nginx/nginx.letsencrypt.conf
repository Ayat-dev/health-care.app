# ============================================================
#  Reverse-proxy TLS pour ClinicApp — variante Let's Encrypt (Z6)
#  Identique à nginx.conf (auto-signé LAN), à deux différences près :
#   1. le serveur HTTP sert le challenge ACME http-01 (certbot webroot)
#      sous /.well-known/acme-challenge/ AVANT de rediriger vers HTTPS ;
#   2. le serveur HTTPS lit les certificats émis par certbot. Ceux-ci sont
#      écrits à un chemin INDÉPENDANT du domaine grâce à `--cert-name clinic`
#      (cf. init-letsencrypt.sh), donc cette conf reste réutilisable telle
#      quelle quel que soit le nom de domaine. certbot les renouvelle en place
#      ; nginx les recharge périodiquement (boucle de reload, cf. compose).
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Upload de fichiers (photos patients, images radio) — aligné sur les 5 Mo applicatifs
    client_max_body_size 6m;

    # ── HTTP : challenge ACME, puis redirection HTTPS ───────────────────────
    server {
        listen 80;
        server_name _;

        # Validation http-01 de Let's Encrypt (certbot --webroot) — NE PAS rediriger.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS : termine le TLS, relaie vers le backend ──────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # Certificats émis par certbot (--cert-name clinic) → chemin fixe, sans domaine.
        ssl_certificate     /etc/letsencrypt/live/clinic/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clinic/privkey.pem;

        # Durcissement TLS : protocoles modernes uniquement (identique à nginx.conf)
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS : force HTTPS côté navigateur pendant 1 an
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
        }
    }
}
