# ============================================================
#  Reverse-proxy TLS pour ClinicApp (P2.5 — chiffrement en transit)
#  Termine le TLS et relaie en clair vers le backend sur le réseau
#  Docker privé (medical_net). Le backend n'est PAS exposé sur l'hôte.
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Journaux d'accès/erreur vers la sortie standard du conteneur
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Upload de fichiers (photos patients, images radio) — aligné sur les 5 Mo applicatifs
    client_max_body_size 6m;

    # ── HTTP : redirige tout vers HTTPS ─────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS : termine le TLS, relaie vers le backend ──────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/clinic.crt;
        ssl_certificate_key /etc/nginx/certs/clinic.key;

        # Durcissement TLS : protocoles modernes uniquement
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS : force HTTPS côté navigateur pendant 1 an
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Indique à Spring (server.forward-headers-strategy=framework) que le
            # schéma d'origine est HTTPS → redirections/cookies corrects.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
        }
    }
}
