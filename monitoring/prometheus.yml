# ============================================================
#  Prometheus — scraping des métriques ClinicApp (P4.3)
#  Démarré via le profil compose « monitoring » :
#      docker compose --profile monitoring up -d
#  Le backend n'est PAS exposé sur l'hôte : Prometheus l'atteint sur le
#  réseau Docker privé (backend:8080).
# ============================================================
global:
  scrape_interval: 30s
  evaluation_interval: 30s

# D2b — règles d'alerte de base (disponibilité backend, heap, taux d'erreurs 5xx).
# Évaluées à chaque evaluation_interval, visibles dans l'onglet « Alerts ».
rule_files:
  - /etc/prometheus/alert.rules.yml

# Routage des alertes (e-mail/webhook) = optionnel : décommenter + démarrer un
# conteneur Alertmanager pour notifier réellement. Sans lui, Prometheus se contente
# d'afficher l'état PENDING/FIRING dans son UI.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'clinicapp-backend'
    metrics_path: /actuator/prometheus
    scheme: http
    # /actuator/prometheus est protégé par HTTP Basic (compte de scraping dédié).
    # ⚠️  Renseigner ici les mêmes valeurs que MONITORING_USERNAME / MONITORING_PASSWORD
    #     du .env (Prometheus ne substitue pas les variables d'environnement dans
    #     basic_auth — valeurs en clair ou via password_file).
    basic_auth:
      username: monitor
      password: remplacer-par-MONITORING_PASSWORD
    static_configs:
      - targets: ['backend:8080']
        labels:
          application: clinicapp
