# ============================================================
#  Grafana — provider de dashboards auto-provisionnés (D2a)
#  Charge tous les JSON déposés dans /var/lib/grafana/dashboards
#  (volume monté depuis monitoring/grafana/dashboards).
# ============================================================
apiVersion: 1

providers:
  - name: ClinicApp
    orgId: 1
    folder: ClinicApp
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
