# ============================================================
#  Prometheus — règles d'alerte de base ClinicApp (D2b)
#  Référencées par prometheus.yml (rule_files) et évaluées à chaque
#  evaluation_interval. Visibles dans l'onglet « Alerts » de Prometheus
#  (PENDING → FIRING). Le routage/notification (e-mail, webhook…) requiert
#  un Alertmanager — optionnel, non démarré par défaut ici (cf. prometheus.yml).
# ============================================================
groups:
  - name: clinicapp-availability
    rules:
      # Cible injoignable : backend down ou /actuator/prometheus inaccessible.
      - alert: ClinicAppBackendDown
        expr: up{job="clinicapp-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend ClinicApp injoignable"
          description: "La cible {{ $labels.instance }} ne répond plus depuis 2 minutes."

  - name: clinicapp-resources
    rules:
      # Heap JVM saturé : risque de GC agressif / OOM imminent.
      - alert: ClinicAppHighHeapUsage
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mémoire heap JVM > 90 %"
          description: "Le heap JVM dépasse 90 % de sa capacité depuis 5 minutes."

      # Taux d'erreurs serveur élevé (5xx) sur les requêtes HTTP.
      - alert: ClinicAppHighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreurs HTTP 5xx > 5 %"
          description: "Plus de 5 % des requêtes HTTP renvoient une erreur serveur depuis 5 minutes."
