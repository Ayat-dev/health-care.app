name: CI

# Build + tests à chaque push sur main et sur chaque PR. Filet automatique contre
# les régressions (RBAC, rendu, invariants métier, migrations Flyway). Les runners
# GitHub disposent de Docker → les tests Testcontainers (schéma sur PostgreSQL réel)
# s'exécutent ici, ce qui n'est pas possible en local sans Docker.
on:
  push:
    branches: [ main ]
  pull_request:

# Annule un run précédent encore en cours sur la même réf (économie de minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        run: mvn -B -ntp -f backend/pom.xml verify

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
